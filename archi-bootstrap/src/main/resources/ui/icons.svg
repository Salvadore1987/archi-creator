<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Спрайт угловых иконок нотации ArchiMate. Один файл на канву и серверный
    писатель SVG: символ рисуется в квадрате 16×16 цветом currentColor
    и масштабируется под размер из shapes.json.
  -->

  <!-- Активная структура -->
  <symbol id="i-actor" viewBox="0 0 16 16">
    <circle cx="8" cy="3.6" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M8 5.9 V10.4 M4 7.6 H12 M8 10.4 L5.2 13.8 M8 10.4 L10.8 13.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-role" viewBox="0 0 16 16">
    <path d="M11.5 4.2 H4.5 A2 3.8 0 0 0 4.5 11.8 H11.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <ellipse cx="11.5" cy="8" rx="2" ry="3.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-collaboration" viewBox="0 0 16 16">
    <circle cx="5.8" cy="8" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="10.2" cy="8" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-interface" viewBox="0 0 16 16">
    <circle cx="10.8" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M1.5 8 H7.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-component" viewBox="0 0 16 16">
    <rect x="4.5" y="2.5" width="9" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <rect x="1.5" y="4.5" width="5" height="2.6" rx=".6" fill="var(--icon-cutout, white)" stroke="currentColor" stroke-width="1.3"/>
    <rect x="1.5" y="8.9" width="5" height="2.6" rx=".6" fill="var(--icon-cutout, white)" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-node" viewBox="0 0 16 16">
    <path d="M1.5 5.5 H11 V14 H1.5 Z M1.5 5.5 L5 2 H14.5 V10.5 L11 14 M11 5.5 L14.5 2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-device" viewBox="0 0 16 16">
    <rect x="2" y="2.5" width="12" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M4.5 13.5 L6 10.5 H10 L11.5 13.5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-system-software" viewBox="0 0 16 16">
    <circle cx="6.6" cy="9.4" r="4.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M7.4 5.1 A4.4 4.4 0 1 1 11.3 9.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-path" viewBox="0 0 16 16">
    <path d="M4 8 H12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/>
    <path d="M4.6 5 L1.6 8 L4.6 11 M11.4 5 L14.4 8 L11.4 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-network" viewBox="0 0 16 16">
    <path d="M4.5 4.5 H14 L11.5 11.5 H2 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="4.5" cy="4.5" r="1.3" fill="currentColor"/>
    <circle cx="14" cy="4.5" r="1.3" fill="currentColor"/>
    <circle cx="11.5" cy="11.5" r="1.3" fill="currentColor"/>
    <circle cx="2" cy="11.5" r="1.3" fill="currentColor"/>
  </symbol>

  <!-- Поведение -->
  <symbol id="i-process" viewBox="0 0 16 16">
    <path d="M1.5 5.5 H9 V3 L14.5 8 L9 13 V10.5 H1.5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-function" viewBox="0 0 16 16">
    <path d="M3 14.2 V5.2 L8 1.8 L13 5.2 V14.2 L8 10.8 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-interaction" viewBox="0 0 16 16">
    <path d="M7 3.2 A4.8 4.8 0 0 0 7 12.8 Z M9 3.2 A4.8 4.8 0 0 1 9 12.8 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-event" viewBox="0 0 16 16">
    <path d="M1.5 4 H10.5 A4 4 0 0 1 10.5 12 H1.5 L4.6 8 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-service" viewBox="0 0 16 16">
    <rect x="1.5" y="4.5" width="13" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  </symbol>

  <!-- Пассивная структура -->
  <symbol id="i-object" viewBox="0 0 16 16">
    <rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M1.5 6 H14.5" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-contract" viewBox="0 0 16 16">
    <rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M1.5 6 H14.5 M1.5 9.8 H14.5" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-representation" viewBox="0 0 16 16">
    <path d="M1.5 2.5 H14.5 V12.2 C11.5 10 8.5 15 1.5 12.2 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M1.5 6 H14.5" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-product" viewBox="0 0 16 16">
    <rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M1.5 6 H8 V2.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-artifact" viewBox="0 0 16 16">
    <path d="M2.5 1.5 H9.5 L13.5 5.5 V14.5 H2.5 Z M9.5 1.5 V5.5 H13.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>

  <!-- Прочее -->
  <symbol id="i-location" viewBox="0 0 16 16">
    <path d="M8 14.2 C8 14.2 3 9.3 3 6.4 A5 5 0 0 1 13 6.4 C13 9.3 8 14.2 8 14.2 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="8" cy="6.3" r="1.7" fill="none" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-grouping" viewBox="0 0 16 16">
    <path d="M1.5 4.5 H6.5 V2.5 H14.5 V13.5 H1.5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 1.6" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-group" viewBox="0 0 16 16">
    <path d="M1.5 4.5 H6.5 V2.5 H14.5 V13.5 H1.5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-junction" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="4" fill="currentColor"/>
  </symbol>
  <symbol id="i-view-ref" viewBox="0 0 16 16">
    <rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path d="M4.5 10.5 L11.5 5.5 M7.5 5.5 H11.5 V9.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-stub" viewBox="0 0 16 16">
    <rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.4 1.8"/>
    <path d="M6.2 6.2 A1.9 1.9 0 1 1 8.6 8 C8 8.3 8 8.8 8 9.4 M8 11.4 v.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
</svg>
