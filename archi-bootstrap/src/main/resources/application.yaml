# ───────────────────────────────────────────────────────────────────
# Общая конфигурация. Здесь только то, что одинаково в dev и prod;
# различия — в application-dev.yaml и application-prod.yaml.
#
# Числа не выдуманы: пул соединений, таймауты и доля трассировки —
# согласованные требования к хранению, внешним вызовам и наблюдаемости.
#
# Секретов в файле нет: пароль БД, ключ Anthropic и client secret
# приходят переменными окружения. Значения по умолчанию
# заданы только там, где это не секрет.
# ───────────────────────────────────────────────────────────────────
spring:
  application:
    name: archi-creator

  datasource:
    url: ${ARCHI_DB_URL:jdbc:postgresql://localhost:5432/archi}
    username: ${ARCHI_DB_USER:archi}
    password: ${ARCHI_DB_PASSWORD}
    hikari:
      # Пул небольшой:
      # масштаб — архитектурная практика банка, десятки пользователей.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000        # мс; HikariConfig принимает число, не Duration
      leak-detection-threshold: 30000 # мс
      pool-name: archi-pool

  jpa:
    open-in-view: false
    hibernate:
      # Схему ведёт Flyway. ddl-auto любого другого значения означало бы
      # два источника правды о схеме.
      ddl-auto: none
    properties:
      # Таймаут запроса выше типового: дерево модели читается одним
      # запросом на тысячи строк.
      jakarta.persistence.query.timeout: 15000
      # Импорт пишет тысячи строк одной транзакцией: без пакетов
      # это тысячи обращений к базе. Ключи — UUIDv7 от приложения, поэтому пакетная
      # вставка не упирается в последовательности.
      hibernate.jdbc.batch_size: 200
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak 26, realm archi. Проверка подписи идёт по
          # кэшированному JWKS, вызова на запрос нет.
          issuer-uri: ${ARCHI_OIDC_ISSUER_URI:http://localhost:8081/realms/archi}

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Импорт .archimate идёт файлом; предел — 50 МБ.
      # Больше — 413 до чтения тела.
      max-file-size: 50MB
      max-request-size: 51MB

server:
  port: 8080
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Список закрытый: всё остальное наружу
        # не выставляется даже в dev.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Доля запросов, попадающих в трассировку.
      probability: 0.1

# ── Настройки приложения ───────────────────────────────────────────
archi:
  modeling:
    # Срок блокировки; клиент продлевает её повторным захватом.
    lock-ttl: 30m
    default-workspace-name: Основное рабочее пространство
    # Очистка снимков версий выключена до этапа 7a:
    # без Git снимок — единственная копия содержимого.
    retention-enabled: false
  ai:
    # Ключ живёт только на сервере и в браузер не попадает.
    # Пустой ключ = ИИ выключен, приложение стартует без него.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-5
    base-url: https://api.anthropic.com
  web:
    cors:
      # Пустой список = CORS закрыт. В dev список расширяется
      # адресом Vite dev-сервера.
      allowed-origins: []
  ui:
    oidc:
      # Отдаётся фронтенду открытым GET /api/v1/ui-config: куда вести на вход.
      enabled: true
      # Адрес realm'а глазами браузера. Внутри сети приложение может ходить
      # к Keycloak иначе, поэтому публичный адрес задаётся отдельно.
      authority: ${ARCHI_OIDC_PUBLIC_ISSUER_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}}
      # Публичный клиент SPA из realm'а Keycloak.
      client-id: archi-creator-ui

logging:
  level:
    root: INFO
    uz.salvadore.hamkorbank.archi: INFO
