# ───────────────────────────────────────────────────────────────────
# Общая конфигурация. Здесь только то, что одинаково в dev и prod;
# различия — в application-dev.yaml и application-prod.yaml.
#
# Числа не выдуманы: пул соединений, таймауты и доля трассировки —
# согласованные требования к хранению, внешним вызовам и наблюдаемости.
#
# Секретов в файле нет: пароль БД, ключ Anthropic и client secret
# приходят переменными окружения. Значения по умолчанию
# заданы только там, где это не секрет.
# ───────────────────────────────────────────────────────────────────
spring:
  application:
    name: archi-creator

  datasource:
    url: ${ARCHI_DB_URL:jdbc:postgresql://localhost:5432/archi}
    username: ${ARCHI_DB_USER:archi}
    password: ${ARCHI_DB_PASSWORD}
    hikari:
      # Пул небольшой:
      # масштаб — архитектурная практика банка, десятки пользователей.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000        # мс; HikariConfig принимает число, не Duration
      leak-detection-threshold: 30000 # мс
      pool-name: archi-pool

  jpa:
    open-in-view: false
    hibernate:
      # Схему ведёт Flyway, Hibernate её только сверяет: расхождение сущности
      # со схемой — отказ старта, а не ошибка первого запроса. Создание или
      # правка схемы здесь означали бы два источника правды о ней.
      ddl-auto: validate
    properties:
      # Таймаут запроса выше типового: дерево модели читается одним
      # запросом на тысячи строк.
      jakarta.persistence.query.timeout: 15000
      # Импорт пишет тысячи строк одной транзакцией: без пакетов
      # это тысячи обращений к базе. Ключи — UUIDv7 от приложения, поэтому пакетная
      # вставка не упирается в последовательности.
      hibernate.jdbc.batch_size: 200
      hibernate.order_inserts: true
      hibernate.order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak 26, realm archi. Проверка подписи идёт по
          # кэшированному JWKS, вызова на запрос нет.
          issuer-uri: ${ARCHI_OIDC_ISSUER_URI:http://localhost:8081/realms/archi}

  jackson:
    default-property-inclusion: non_null

  # Сообщения сервера — i18n/messages*.properties. Язык — из Accept-Language,
  # без него и для неизвестного языка — русский: интерфейс продукта русский.
  # Системная локаль сервера на выбор языка не влияет.
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true

  web:
    locale: ru
    locale-resolver: accept-header

  mvc:
    async:
      # Поток помощника: документация по модели идёт до пяти минут.
      request-timeout: 330s

  servlet:
    multipart:
      # Импорт .archimate идёт файлом; предел — 50 МБ.
      # Больше — 413 до чтения тела.
      max-file-size: 50MB
      max-request-size: 51MB

server:
  port: 8080
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Список закрытый: всё остальное наружу
        # не выставляется даже в dev.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Доля запросов, попадающих в трассировку.
      probability: 0.1

# ── Настройки приложения ───────────────────────────────────────────
archi:
  modeling:
    # Срок блокировки; клиент продлевает её повторным захватом.
    lock-ttl: 30m
    # Имя первого пространства на пустой базе. Пусто — текст ресурсов на языке
    # приложения по умолчанию; задаётся установкой, если имя у неё своё.
    default-workspace-name: ${ARCHI_DEFAULT_WORKSPACE_NAME:}
    # Очистка снимков версий: только в пространстве с доступным Git —
    # без него снимок единственная копия содержимого.
    retention-enabled: true
  interchange:
    # Импорт в одно пространство последователен: параллельные сессии конкурировали
    # бы за модель и создавали версии в непредсказуемом порядке. Следующий — отказ 409.
    max-parallel-imports-per-workspace: 1
    # Растр PNG держит в куче площадь × 4 байта: не больше 64 Мпикс (8 000 × 8 000) и по одной
    # растеризации за раз. Очередь честная; ждать растеризатора дольше — отказ 503.
    png-max-area-px: 64000000
    max-parallel-rasterizations: 1
    rasterization-wait: 60000        # мс
  git:
    # Bare-клоны репозиториев рабочих пространств — кэш: потеря стоит одного fetch.
    cache-dir: ${ARCHI_GIT_CACHE_DIR:${java.io.tmpdir}/archi-git}
    committer-name: ${ARCHI_GIT_COMMITTER_NAME:Archi Creator}
    committer-email: ${ARCHI_GIT_COMMITTER_EMAIL:archi-creator@localhost}
    poll-interval: 10s
    # Закрытые записи очереди публикации: версия уже несёт git_sha, запись нужна только для разбора.
    outbox-retention: 30d
    # Репозиторий в файловой системе сервера (file://) — только в тестах: иначе администратор
    # привязал бы любой каталог сервера.
    allow-local-repositories: false
  ai:
    # Ключ живёт только на сервере и в браузер не попадает.
    # Пустой ключ = помощник отвечает «недоступен», приложение стартует без него.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ARCHI_AI_MODEL:claude-sonnet-5}
    base-url: ${ARCHI_AI_BASE_URL:https://api.anthropic.com}
    # Глубина рассуждения: меньше — быстрее первые токены.
    effort: medium
    timeout: 180s
    # Повторы только до первого токена: после него пользователь уже видит ответ.
    max-retries: 2
    max-output-tokens: 16000
    # Верхняя граница контекста одного запроса и доля области, ниже которой
    # усечённый контекст не отправляется (413 с предложением выбрать представление).
    max-context-tokens: 120000
    min-coverage: 0.25
    # Лимит пространства, которому администратор его не задал.
    default-monthly-token-limit: 5000000
    user-requests-per-minute: 5
    workspace-requests-per-minute: 20
    # Месяц бюджета начинается с первого числа по этому поясу.
    budget-zone: ${ARCHI_AI_BUDGET_ZONE:Asia/Tashkent}
  web:
    cors:
      # Пустой список = CORS закрыт. В dev список расширяется
      # адресом Vite dev-сервера.
      allowed-origins: []
  ui:
    oidc:
      # Отдаётся фронтенду открытым GET /api/v1/ui-config: куда вести на вход.
      enabled: true
      # Адрес realm'а глазами браузера. Внутри сети приложение может ходить
      # к Keycloak иначе, поэтому публичный адрес задаётся отдельно.
      authority: ${ARCHI_OIDC_PUBLIC_ISSUER_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}}
      # Публичный клиент SPA из realm'а Keycloak.
      client-id: archi-creator-ui

logging:
  level:
    root: INFO
    uz.salvadore.hamkorbank.archi: INFO
