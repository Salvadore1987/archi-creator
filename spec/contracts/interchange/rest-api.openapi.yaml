openapi: 3.1.0

info:
  title: Interchange API
  version: 1.0.0
  description: |
    Синхронный REST API для BC Interchange: импорт и экспорт модели
    (docs/backend.md §5, §5.2, §8.2–§8.3).

    Каждая операция ссылается на use case в `x-use-case` и на строку таблицы
    доступа в `x-operation` (spec/nfr/interchange.yaml#security.authorization).
    Наполнено на этапе 2 (2026-10-08); операции этапов 5a, 6a и 7a–7c
    перечислены в конце раздела `paths` и появятся вместе со своими use case'ами.

servers:
  - url: /api/v1
    description: Относительный путь; приложение и фронтенд отдаются одним артефактом.

security:
  - bearerAuth: []

tags:
  - name: interchange
    description: Импорт, экспорт, рендер представлений, обмен с Git.

paths:

  /models/import:
    post:
      tags: [interchange]
      operationId: importArchimateFile
      summary: Импорт .archimate новой моделью (FR-01, FR-49, FR-50)
      x-use-case: UC-IXC-001
      x-operation: ImportArchimateFile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid },
            description: "Без него — первое пространство." }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "До 50 МБ (spec/nfr/interchange.yaml)." }
      responses:
        '201':
          description: Модель создана с версией 1; нарушения матрицы — в `findings` (мягкий режим).
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportReport' } }
        '200':
          description: Повтор ключа — результат первой попытки (INV-IXC-003).
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportReport' } }
        '400':
          description: |
            Повреждённые данные — невалидный XML, битая ссылка, дубль id, связь без конца —
            отказ в любом режиме (FR-50). `code: IXC_CORRUPT_DOCUMENT`, находки — в `findings`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '403':
          description: Импорт доступен ARCHITECT и ADMIN.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: Ключ уже использован для другого файла (INV-IXC-003).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '413':
          description: Файл больше предела — отказ до чтения тела.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity422' }

  /models/{id}/export:
    get:
      tags: [interchange]
      operationId: exportModel
      summary: Выгрузка зафиксированной версии (INV-IXC-008)
      x-use-case: UC-IXC-002
      x-operation: ExportArchimate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: fmt, required: false, schema: { type: string, enum: [archimate, csv, oef], default: archimate },
            description: "csv — каталог (§5.2, FR-45, x-operation ExportCatalogCsv); oef — этап 6a, сейчас 422 `IXC_FORMAT_NOT_AVAILABLE`." }
        - { in: query, name: version, required: false, schema: { type: integer, format: int64 },
            description: "Номер версии; без него — последняя." }
        - { in: query, name: folder, required: false, schema: { type: string },
            description: "Только csv: archi_id папки — выгрузка поддерева («каталог приложений»)." }
        - { in: query, name: sep, required: false, schema: { type: string, enum: [";", ",", "tab"], default: ";" },
            description: "Только csv: разделитель; ';' — для русской локали Excel." }
      responses:
        '200':
          description: |
            Файл версии; побайтово тот же при повторе (INV-IXC-004). Номер версии —
            в заголовке `X-Archi-Version-No`, отпечаток — в `ETag`.
          content:
            application/xml: { schema: { type: string, format: binary } }
            application/zip:
              schema: { type: string, format: binary }
              description: "csv: elements.csv и relations.csv, UTF-8 с BOM." 
        '404':
          description: Модели нет или она скрыта списком доступа (INV-MDL-011).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: Модель удалена — `MODEL_DELETED`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '410':
          description: Снимок версии очищен, Git не настроен (FR-47).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /workspaces/{id}/import-settings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [interchange]
      operationId: importSettings
      summary: Строгость импорта пространства (FR-49)
      x-use-case: UC-IXC-001
      responses:
        '200':
          description: Текущее значение.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportSettings' } }
    put:
      tags: [interchange]
      operationId: configureImportSettings
      summary: Строгость меняет только ADMIN (FR-49)
      x-use-case: UC-IXC-001
      x-operation: ConfigureImportPolicy
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportSettings' } }
      responses:
        '200':
          description: Новое значение.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportSettings' } }
        '403':
          description: Не ADMIN.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

# ───────────────────────────────────────────────────────────────────
# Появятся со своими use case'ами:
#
#   GET  /views/{id}/export             ?fmt=svg|png — этап 5a (§6.10)
#   GET  /models/{id}/views/export      пакетная выгрузка — этап 5a
#   GET  /models/{id}/export?fmt=oef    этап 6a (§3.5)
#   POST /models/{id}/git/push          этап 7a
#   POST /models/{id}/git/pull          этап 7b
#   POST /models/{id}/git/merge         этап 7c
#   PUT  /workspaces/{id}/git-binding   этап 7a
#
# Импорта из OEF и CSV в этом списке нет и не будет: единственный
# принимаемый формат — .archimate (FR-01, docs/backend.md §3.5).
# ───────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 64 }
      description: |
        Ключ дедупликации импорта. Тот же ключ возвращает существующую
        сессию; тот же ключ с другим содержимым файла — `409`.
        См. INV-IXC-003. Без ключа сервер берёт случайный: повтор такого
        запроса — новая модель.

  schemas:

    Problem:
      type: object
      description: RFC 7807 Problem Details + поле `code` (docs/backend.md §8.1).
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        code:
          type: string
          description: Код нарушенного инварианта (`INV-IXC-001` … `INV-IXC-010`).
          examples: ["INV-IXC-007", "INV-IXC-003"]

    ImportReport:
      type: object
      description: |
        Отчёт импорта. Отдаётся и при успехе, и при отказе: отказ без
        объяснения превращает строгий режим в чёрный ящик (INV-IXC-007).
        При отказе те же поля — в теле `problem+json`.
      required: [sessionId, status, findings]
      properties:
        sessionId: { type: string, format: uuid }
        modelId:   { type: string, format: uuid }
        versionNo: { type: integer, format: int64 }
        status:    { type: string, enum: [RECEIVED, PARSED, VALIDATED, APPLIED, REJECTED] }
        replayed:  { type: boolean, description: "Повтор ключа — результат первой попытки." }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }

    ImportSettings:
      type: object
      required: [strictImport]
      properties:
        strictImport: { type: boolean }

    ImportFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        code:     { type: string, examples: ["IXC_UNKNOWN_ELEMENT_TYPE"] }
        message:  { type: string }
        archiId:  { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,254}$' }
        xmlLine:  { type: integer, minimum: 1 }

    LossReport:
      type: object
      description: |
        Отчёт о потерях выгрузки. Отдаётся вместе с артефактом всегда;
        пустой `entries` — валидный отчёт, отсутствие отчёта — нет
        (INV-IXC-006).
      required: [format, sourceVersionNo, entries]
      properties:
        format:          { type: string, enum: [ARCHIMATE, OPEN_EXCHANGE, CSV_CATALOG, SVG, PNG, GIT_YAML] }
        sourceVersionNo: { type: integer, format: int64 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LossEntry' }

    LossEntry:
      type: object
      required: [archiId, objectKind, lostAspect, reason]
      properties:
        archiId:    { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,254}$' }
        objectKind: { type: string, enum: [element, relationship, view, node, edge, property] }
        lostAspect: { type: string }
        reason:     { type: string }

  responses:

    UnprocessableEntity422:
      description: |
        Строгий режим и находки уровня ERROR — модель не создана (INV-IXC-007, FR-49).
        `code: IXC_STRICT_IMPORT_REJECTED`, находки — в `findings`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
