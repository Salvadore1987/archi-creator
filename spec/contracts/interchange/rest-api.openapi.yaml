openapi: 3.1.0

info:
  title: Interchange API
  version: 1.0.0
  description: |
    Синхронный REST API для BC Interchange: импорт и экспорт модели
    (docs/backend.md §5, §5.2, §8.2–§8.3).

    Каждая операция ссылается на use case в `x-use-case` и на строку таблицы
    доступа в `x-operation` (spec/nfr/interchange.yaml#security.authorization).
    Наполнено на этапе 2 (2026-10-08), картинки представлений — этап 5a
    (2026-10-12), OEF — этап 6a, привязка к Git и публикация — этап 7a
    (2026-10-13), импорт по ссылке — этап 7b, слияние предложения — этап 7c
    (2026-10-14).

servers:
  - url: /api/v1
    description: Относительный путь; приложение и фронтенд отдаются одним артефактом.

security:
  - bearerAuth: []

tags:
  - name: interchange
    description: Импорт, экспорт, рендер представлений, обмен с Git.

paths:

  /models/import:
    post:
      tags: [interchange]
      operationId: importArchimateFile
      summary: Импорт .archimate новой моделью (FR-01, FR-49, FR-50)
      x-use-case: UC-IXC-001
      x-operation: ImportArchimateFile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid },
            description: "Без него — первое пространство." }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "До 50 МБ (spec/nfr/interchange.yaml)." }
      responses:
        '201':
          description: Модель создана с версией 1; нарушения матрицы — в `findings` (мягкий режим).
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportReport' } }
        '200':
          description: Повтор ключа — результат первой попытки (INV-IXC-003).
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportReport' } }
        '400':
          description: |
            Повреждённые данные — невалидный XML, битая ссылка, дубль id, связь без конца —
            отказ в любом режиме (FR-50). `code: IXC_CORRUPT_DOCUMENT`, находки — в `findings`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '403':
          description: Импорт доступен ARCHITECT и ADMIN.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: Ключ уже использован для другого файла (INV-IXC-003).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '413':
          description: Файл больше предела — отказ до чтения тела.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422': { $ref: '#/components/responses/UnprocessableEntity422' }

  /models/{id}/export:
    get:
      tags: [interchange]
      operationId: exportModel
      summary: Выгрузка зафиксированной версии (INV-IXC-008)
      x-use-case: UC-IXC-002
      x-operation: ExportArchimate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: fmt, required: false, schema: { type: string, enum: [archimate, csv, oef], default: archimate },
            description: "csv — каталог (§5.2, FR-45, x-operation ExportCatalogCsv); oef — Open Exchange Format (§3.5, FR-43, FR-44, UC-IXC-005, x-operation ExportOpenExchange)." }
        - { in: query, name: version, required: false, schema: { type: integer, format: int64 },
            description: "Номер версии; без него — последняя." }
        - { in: query, name: folder, required: false, schema: { type: string },
            description: "Только csv: archi_id папки — выгрузка поддерева («каталог приложений»)." }
        - { in: query, name: sep, required: false, schema: { type: string, enum: [";", ",", "tab"], default: ";" },
            description: "Только csv: разделитель; ';' — для русской локали Excel." }
      responses:
        '200':
          description: |
            Файл версии; побайтово тот же при повторе (INV-IXC-004). Номер версии —
            в заголовке `X-Archi-Version-No`, отпечаток — в `ETag`, число записей
            отчёта о потерях — в `X-Archi-Loss-Count` (у archimate — 0).
          content:
            application/xml: { schema: { type: string, format: binary } }
            application/zip:
              schema: { type: string, format: binary }
              description: |
                csv: elements.csv и relations.csv, UTF-8 с BOM.
                oef: `<слаг модели>-v<N>.xml` (слаг в латинице), проверенный по XSD 3.1, и `loss-report.json`;
                число записей отчёта — в `X-Archi-Loss-Count`.
        '404':
          description: Модели нет или она скрыта списком доступа (INV-MDL-011).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: |
            Модель удалена — `MODEL_DELETED`; снимок, собранный из коммита версии, не совпал
            с её отпечатком — `INV-IXC-008` (не тот снимок не отдаётся).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '410':
          description: |
            Снимок версии очищен, а вернуть его неоткуда: привязки к Git нет
            или в коммите версии нет каталога модели (FR-47). С привязкой очищенный
            снимок собирается из коммита прозрачно (FR-46).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '503':
          description: Снимок очищен, а репозиторий недоступен — `IXC_GIT_UNREACHABLE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '500':
          description: |
            Только oef: результат не прошёл официальную XSD — `IXC_OEF_SCHEMA_VIOLATION`.
            Файл не отдаётся, это ошибка сервера, а не запроса (FR-43).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /views/{id}/export:
    get:
      tags: [interchange]
      operationId: exportViewImage
      summary: Картинка представления из зафиксированной версии (FR-41, INV-IXC-008)
      x-use-case: UC-IXC-004
      x-operation: ExportViewImage
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid },
            description: "Представление; ищется в снимке версии по своему archiId." }
        - $ref: '#/components/parameters/ImageFormat'
        - $ref: '#/components/parameters/ImageScale'
        - $ref: '#/components/parameters/ImageOutline'
        - $ref: '#/components/parameters/ImageBackground'
        - { in: query, name: version, required: false, schema: { type: integer, format: int64 },
            description: "Номер версии; без него — последняя." }
      responses:
        '200':
          description: |
            Картинка; номер версии — в `X-Archi-Version-No`, число записей отчёта
            о потерях — в `X-Archi-Loss-Count` (INV-IXC-006), отпечаток — в `ETag`.
          content:
            image/svg+xml: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '404':
          description: Представления нет, оно скрыто списком доступа или его нет в версии — `IXC_VIEW_NOT_IN_VERSION`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '410':
          description: Снимок версии очищен, Git не настроен (FR-47).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422': { $ref: '#/components/responses/ImageOptionRejected422' }

  /models/{id}/views/export:
    get:
      tags: [interchange]
      operationId: exportAllViewImages
      summary: Все представления модели одним архивом из одной версии (FR-41, INV-IXC-008)
      x-use-case: UC-IXC-004
      x-operation: ExportAllViewImages
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ImageFormat'
        - $ref: '#/components/parameters/ImageScale'
        - $ref: '#/components/parameters/ImageOutline'
        - $ref: '#/components/parameters/ImageBackground'
        - { in: query, name: version, required: false, schema: { type: integer, format: int64 },
            description: "Номер версии; без него — последняя." }
      responses:
        '200':
          description: |
            Zip: файл `<слаг>.<8 hex>.<ext>` на представление и `loss-report.json`
            (схема `LossReport` на каждое представление). Все файлы — из одной версии,
            её номер в `X-Archi-Version-No`.
          content:
            application/zip: { schema: { type: string, format: binary } }
        '404':
          description: Модели нет или она скрыта списком доступа (INV-MDL-011).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: Модель удалена — `MODEL_DELETED`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '410':
          description: Снимок версии очищен, Git не настроен (FR-47).
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422': { $ref: '#/components/responses/ImageOptionRejected422' }

  /workspaces/{id}/import-settings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [interchange]
      operationId: importSettings
      summary: Строгость импорта пространства (FR-49)
      x-use-case: UC-IXC-001
      responses:
        '200':
          description: Текущее значение.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportSettings' } }
    put:
      tags: [interchange]
      operationId: configureImportSettings
      summary: Строгость меняет только ADMIN (FR-49)
      x-use-case: UC-IXC-001
      x-operation: ConfigureImportPolicy
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImportSettings' } }
      responses:
        '200':
          description: Новое значение.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ImportSettings' } }
        '403':
          description: Не ADMIN.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /workspaces/{id}/git-binding:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [interchange]
      operationId: gitBinding
      summary: Привязка рабочего пространства к репозиторию (FR-37)
      x-use-case: UC-IXC-003
      x-operation: ConfigureGitBinding
      responses:
        '200':
          description: Текущая привязка; токена в ответе нет — только ссылка на секрет.
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitBinding' } }
        '404':
          description: Привязки нет — `IXC_NOT_FOUND`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    put:
      tags: [interchange]
      operationId: configureGitBinding
      summary: Настроить привязку; заменяет прежнюю (только ADMIN)
      x-use-case: UC-IXC-003
      x-operation: ConfigureGitBinding
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GitBindingSettings' } }
      responses:
        '200':
          description: |
            Привязка в состоянии `CONFIGURED`. Доступность репозитория проверяется
            при первой публикации, а не здесь: настройка не ждёт сети.
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitBinding' } }
        '422':
          description: Адрес, ветка, ссылка на секрет или автор не того формата — `IXC_INVALID_REQUEST`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '403':
          description: Не ADMIN.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    delete:
      tags: [interchange]
      operationId: disableGitBinding
      summary: Снять привязку — `DISABLED`, терминально (только ADMIN)
      description: |
        Коммиты в репозитории не трогаются. С этого момента очистка снимков
        в пространстве не идёт (FR-47).
      x-use-case: UC-IXC-003
      x-operation: ConfigureGitBinding
      responses:
        '204': { description: Привязка снята. }
        '404':
          description: Привязки нет.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /models/{id}/git/push:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [interchange]
      operationId: pushModelToGit
      summary: Опубликовать ожидающие версии модели сейчас (UC-IXC-003)
      description: |
        Публикация идёт и сама — после каждого сохранения, из outbox. Этот вызов
        не создаёт версию, а догоняет очередь немедленно, например после
        восстановления доступа к репозиторию. Ответ — состояние модели в Git.
      x-use-case: UC-IXC-003
      x-operation: PushModelToGit
      responses:
        '200':
          description: Очередь модели пройдена или остановлена расхождением.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ModelGitStatus' } }
        '404':
          description: Модели нет или она скрыта списком доступа.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: У рабочего пространства нет рабочей привязки — `IXC_GIT_NOT_BOUND`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '503':
          description: Репозиторий недоступен — `IXC_GIT_UNREACHABLE`; версии ждут в очереди.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /models/{id}/git/pull/preview:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [interchange]
      operationId: previewModelPull
      summary: Отчёт об изменениях по ссылке Git — ничего не меняет (UC-IXC-006, FR-38)
      description: |
        Ссылка — ветка, тег или коммит репозитория привязки; разрешается как
        в `git rev-parse`, тег раньше ветки. Состояние модели из коммита
        сравнивается с текущим содержимым модели. `commitSha` и `baseHash`
        отчёта нужны для применения: применяется ровно то, что в отчёте.
      x-use-case: UC-IXC-006
      x-operation: PullModelFromGit
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GitPullPreviewRequest' } }
      responses:
        '200':
          description: Отчёт; находки разбора и методологии — в `findings`.
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitPullPreview' } }
        '404':
          description: |
            Модели нет или она скрыта; ссылки нет в репозитории — `IXC_GIT_REF_NOT_FOUND`;
            в коммите нет каталога модели — `IXC_GIT_MODEL_NOT_IN_REF`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: У рабочего пространства нет рабочей привязки — `IXC_GIT_NOT_BOUND`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422':
          description: Ссылка пуста или недопустима — `IXC_INVALID_REQUEST`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '503':
          description: Репозиторий недоступен — `IXC_GIT_UNREACHABLE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /models/{id}/git/pull:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [interchange]
      operationId: pullModelFromGit
      summary: Применить состояние из коммита отчёта новой версией (UC-IXC-006, INV-IXC-012)
      description: |
        Одной транзакцией: содержимое модели заменяется, фиксируется новая версия,
        сессия импорта закрывается. Нужна блокировка модели у вызывающего.
        Отказ оставляет только сессию `REJECTED` с причиной.
      x-use-case: UC-IXC-006
      x-operation: PullModelFromGit
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GitPullRequest' } }
      responses:
        '200':
          description: Применено; `created = false` — содержимое совпало с текущим, версии нет.
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitPullResult' } }
        '404':
          description: Модели нет; коммита нет в репозитории — `IXC_GIT_REF_NOT_FOUND`; каталога модели нет — `IXC_GIT_MODEL_NOT_IN_REF`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: |
            Содержимое модели изменилось после отчёта — `INV-IXC-012`, нужен новый отчёт;
            модель не заблокирована вызывающим — `INV-MDL-006`; нет привязки — `IXC_GIT_NOT_BOUND`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422':
          description: |
            Каталог не собирается в документ — `IXC_CORRUPT_DOCUMENT`; строгий режим
            и нарушения методологии — `IXC_STRICT_IMPORT_REJECTED`; поля не заданы —
            `IXC_INVALID_REQUEST`. Отказ после разбора несёт `sessionId` и `findings`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '503':
          description: Репозиторий недоступен — `IXC_GIT_UNREACHABLE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /models/{id}/git/merge/preview:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [interchange]
      operationId: previewModelMerge
      summary: Отчёт слияния предложения по сущностям — ничего не меняет (UC-IXC-007, FR-39)
      description: |
        Три состояния — общий предок, текущее содержимое модели и каталог модели
        в коммите ссылки — сравниваются по `archiId` и полям объектов (INV-IXC-010).
        Выборы по конфликтам необязательны: отчёт пересчитывает результат с ними,
        конфликт без выбора показывается в пользу «нашего». `commitSha`,
        `mergeBaseSha` и `baseHash` отчёта нужны для применения.
      x-use-case: UC-IXC-007
      x-operation: MergeModelBranch
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GitMergePreviewRequest' } }
      responses:
        '200':
          description: Отчёт; конфликты, каскад, изменения и отметки для холста.
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitMergePreview' } }
        '404':
          description: |
            Модели нет или она скрыта; ссылки нет — `IXC_GIT_REF_NOT_FOUND`;
            в коммите нет каталога модели — `IXC_GIT_MODEL_NOT_IN_REF`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: |
            Нет рабочей привязки — `IXC_GIT_NOT_BOUND`; нет опубликованной версии,
            общего предка или каталога модели в нём — `IXC_GIT_NO_MERGE_BASE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422':
          description: Ссылка пуста или недопустима, выбор по несуществующему конфликту — `IXC_INVALID_REQUEST`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '503':
          description: Репозиторий недоступен — `IXC_GIT_UNREACHABLE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

  /models/{id}/git/merge:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [interchange]
      operationId: mergeModelBranch
      summary: Применить слияние из отчёта новой версией (UC-IXC-007, INV-IXC-010, INV-IXC-012)
      description: |
        Читаются ровно коммиты отчёта, слияние строится заново с переданными выборами.
        Одной транзакцией: содержимое заменяется, фиксируется версия, слитый коммит
        записывается за моделью, сессия импорта закрывается. Нужна блокировка модели.
      x-use-case: UC-IXC-007
      x-operation: MergeModelBranch
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GitMergeRequest' } }
      responses:
        '200':
          description: Применено; `created = false` — результат совпал с текущим, версии нет.
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitMergeResult' } }
        '404':
          description: Модели нет; коммита нет — `IXC_GIT_REF_NOT_FOUND`; каталога модели нет — `IXC_GIT_MODEL_NOT_IN_REF`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '409':
          description: |
            Содержимое модели изменилось после отчёта — `INV-IXC-012`; модель не заблокирована
            вызывающим — `INV-MDL-006`; нет привязки — `IXC_GIT_NOT_BOUND`; нет общего
            предка — `IXC_GIT_NO_MERGE_BASE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '422':
          description: |
            Остались конфликты без выбора — `IXC_MERGE_CONFLICTS_UNRESOLVED` (в `conflicts` —
            их адреса); каталог не собирается — `IXC_CORRUPT_DOCUMENT`; строгий режим —
            `IXC_STRICT_IMPORT_REJECTED`; поля не заданы или выбор по несуществующему
            конфликту — `IXC_INVALID_REQUEST`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
        '503':
          description: Репозиторий недоступен — `IXC_GIT_UNREACHABLE`.
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }

# ───────────────────────────────────────────────────────────────────
# Импорта из OEF и CSV в этом списке нет и не будет: единственный
# принимаемый формат — .archimate (FR-01, docs/backend.md §3.5).
# ───────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ImageFormat:
      in: query
      name: fmt
      required: false
      schema: { type: string, enum: [svg, png], default: svg }
      description: Формат картинки (§6.10).
    ImageScale:
      in: query
      name: scale
      required: false
      schema: { type: integer, enum: [1, 2, 4], default: 1 }
      description: Плотность PNG; у SVG не влияет.
    ImageOutline:
      in: query
      name: outline
      required: false
      schema: { type: boolean, default: false }
      description: |
        `true` — подписи в кривых, для получателей без шрифта (Inkscape, Word).
        Без него текст остаётся текстом, шрифт вшит в файл подмножеством глифов.
    ImageBackground:
      in: query
      name: background
      required: false
      schema: { type: string, enum: [paper, transparent], default: paper }
      description: Фон под диаграммой.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 64 }
      description: |
        Ключ дедупликации импорта. Тот же ключ возвращает существующую
        сессию; тот же ключ с другим содержимым файла — `409`.
        См. INV-IXC-003. Без ключа сервер берёт случайный: повтор такого
        запроса — новая модель.

  schemas:

    Problem:
      type: object
      description: RFC 7807 Problem Details + поле `code` (docs/backend.md §8.1).
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        code:
          type: string
          description: Код нарушенного инварианта (`INV-IXC-001` … `INV-IXC-010`).
          examples: ["INV-IXC-007", "INV-IXC-003"]

    ImportReport:
      type: object
      description: |
        Отчёт импорта. Отдаётся и при успехе, и при отказе: отказ без
        объяснения превращает строгий режим в чёрный ящик (INV-IXC-007).
        При отказе те же поля — в теле `problem+json`.
      required: [sessionId, status, findings]
      properties:
        sessionId: { type: string, format: uuid }
        modelId:   { type: string, format: uuid }
        versionNo: { type: integer, format: int64 }
        status:    { type: string, enum: [RECEIVED, PARSED, VALIDATED, APPLIED, REJECTED] }
        replayed:  { type: boolean, description: "Повтор ключа — результат первой попытки." }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }

    GitBindingSettings:
      type: object
      required: [repoUrl, tokenRef]
      properties:
        repoUrl:  { type: string, maxLength: 1000, examples: ["https://gitlab.bank.uz/ea/landscape.git"] }
        branch:   { type: string, maxLength: 200, default: main }
        tokenRef:
          type: string
          description: |
            Ссылка на секрет, а не сам токен (NFR-06): `env:<ИМЯ>` — переменная
            окружения сервера.
          examples: ["env:ARCHI_GIT_TOKEN"]
        authors:
          type: array
          description: Соответствие субъекта Keycloak автору коммита.
          items: { $ref: '#/components/schemas/GitAuthor' }

    GitAuthor:
      type: object
      required: [subject, name, email]
      properties:
        subject: { type: string }
        name:    { type: string }
        email:   { type: string }

    GitBinding:
      type: object
      required: [repoUrl, branch, tokenRef, status, authors]
      properties:
        repoUrl:       { type: string }
        branch:        { type: string }
        tokenRef:      { type: string }
        status:        { type: string, enum: [CONFIGURED, UNREACHABLE, DISABLED] }
        lastCommitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        lastCheckedAt: { type: string, format: date-time }
        authors:
          type: array
          items: { $ref: '#/components/schemas/GitAuthor' }

    ModelGitStatus:
      type: object
      required: [modelId, state, pending]
      properties:
        modelId:   { type: string, format: uuid }
        state:
          type: string
          enum: [SYNCED, PENDING, DIVERGED]
          description: |
            SYNCED — все версии в репозитории; PENDING — версии ждут публикации;
            DIVERGED — каталог модели в ветке изменён не сервером (FR-37),
            очередь стоит до импорта головы ветки (UC-IXC-006) или её слияния (UC-IXC-007).
        pending:   { type: integer, description: "Сколько версий ждут публикации." }
        versionNo: { type: integer, format: int64, description: "Последняя опубликованная версия." }
        gitSha:    { type: string, pattern: '^[0-9a-f]{40}$' }
        divergedVersionNo: { type: integer, format: int64 }

    GitPullPreviewRequest:
      type: object
      required: [ref]
      properties:
        ref: { type: string, maxLength: 255, examples: ["main", "v2026.10", "3f9c2e1"] }

    GitPullRequest:
      type: object
      required: [ref, commitSha, baseHash]
      properties:
        ref:       { type: string, maxLength: 255, description: "Ссылка из отчёта — для сессии и комментария." }
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$', description: "Коммит из отчёта." }
        baseHash:  { type: string, pattern: '^[0-9a-f]{64}$', description: "Отпечаток содержимого модели из отчёта." }
        comment:   { type: string, maxLength: 2000 }

    GitPullPreview:
      type: object
      required: [modelId, ref, refKind, commitSha, baseHash, targetHash, unchanged, applicable, summary, changes, findings]
      properties:
        modelId:       { type: string, format: uuid }
        ref:           { type: string }
        refKind:       { type: string, enum: [BRANCH, TAG, COMMIT] }
        commitSha:     { type: string, pattern: '^[0-9a-f]{40}$' }
        baseVersionNo: { type: integer, format: int64, description: "Последняя версия модели; нет версий — поля нет." }
        baseHash:      { type: string, pattern: '^[0-9a-f]{64}$', description: "Отпечаток текущего содержимого модели." }
        targetHash:    { type: string, pattern: '^[0-9a-f]{64}$', description: "Отпечаток состояния из коммита." }
        unchanged:     { type: boolean, description: "Состояние из коммита совпадает с текущим." }
        applicable:    { type: boolean, description: "Применение пройдёт разбор и строгий режим пространства." }
        summary:
          type: array
          items: { $ref: '#/components/schemas/GitChangeCount' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/GitChange' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }

    GitChangeCount:
      type: object
      required: [kind, added, removed, changed]
      properties:
        kind:    { type: string, enum: [MODEL, FOLDER, ELEMENT, RELATIONSHIP, VIEW] }
        added:   { type: integer }
        removed: { type: integer }
        changed: { type: integer }

    GitChange:
      type: object
      required: [kind, change, archiId, fields]
      properties:
        kind:     { type: string, enum: [MODEL, FOLDER, ELEMENT, RELATIONSHIP, VIEW] }
        change:   { type: string, enum: [ADDED, REMOVED, CHANGED] }
        archiId:  { type: string }
        type:     { type: string, description: "Тип ArchiMate; у папок нет.", examples: ["ApplicationComponent"] }
        name:     { type: string, description: "Имя после изменения, у удалённого — до." }
        fields:
          type: array
          description: Изменённые поля; у добавленных и удалённых пусто.
          items:
            type: string
            examples: [name, type, documentation, properties, folder, source, target, diagram, order, raw_xml]

    GitPullResult:
      type: object
      required: [sessionId, status, modelId, versionNo, created, commitSha]
      properties:
        sessionId: { type: string, format: uuid }
        status:    { type: string, enum: [APPLIED] }
        modelId:   { type: string, format: uuid }
        versionNo: { type: integer, format: int64 }
        created:   { type: boolean, description: "Ложь — содержимое совпало с текущим, версия прежняя." }
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }

    GitMergeResolution:
      type: string
      enum: [OURS, THEIRS]
      description: |
        Выбор по конфликту. У конфликта удаления против правки «наше» и «их» —
        это стороны: та, что удалила, и та, что правила.

    GitMergePreviewRequest:
      type: object
      required: [ref]
      properties:
        ref: { type: string, maxLength: 255, examples: ["proposal/kanaly", "main"] }
        resolutions:
          type: object
          description: Выборы по адресу конфликта `<archiId>:<поле>`.
          additionalProperties: { $ref: '#/components/schemas/GitMergeResolution' }

    GitMergeRequest:
      type: object
      required: [ref, commitSha, mergeBaseSha, baseHash]
      properties:
        ref:          { type: string, maxLength: 255 }
        commitSha:    { type: string, pattern: '^[0-9a-f]{40}$', description: "Коммит предложения из отчёта." }
        mergeBaseSha: { type: string, pattern: '^[0-9a-f]{40}$', description: "Общий предок из отчёта." }
        baseHash:     { type: string, pattern: '^[0-9a-f]{64}$', description: "Отпечаток содержимого модели из отчёта." }
        resolutions:
          type: object
          description: Выбор по каждому конфликту отчёта.
          additionalProperties: { $ref: '#/components/schemas/GitMergeResolution' }
        comment:      { type: string, maxLength: 2000 }

    GitMergePreview:
      type: object
      required: [modelId, ref, refKind, commitSha, mergeBaseSha, baseHash, targetHash, unchanged, applicable,
                 conflicts, cascade, summary, changes, marks, views, findings]
      properties:
        modelId:       { type: string, format: uuid }
        ref:           { type: string }
        refKind:       { type: string, enum: [BRANCH, TAG, COMMIT] }
        commitSha:     { type: string, pattern: '^[0-9a-f]{40}$' }
        mergeBaseSha:  { type: string, pattern: '^[0-9a-f]{40}$' }
        baseVersionNo: { type: integer, format: int64 }
        baseHash:      { type: string, pattern: '^[0-9a-f]{64}$', description: "Отпечаток текущего содержимого." }
        targetHash:    { type: string, pattern: '^[0-9a-f]{64}$', description: "Отпечаток результата с выборами отчёта." }
        unchanged:     { type: boolean, description: "Результат совпадает с текущим содержимым." }
        applicable:    { type: boolean, description: "Конфликты разрешены, разбор и строгий режим пройдут." }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/GitMergeConflict' }
        cascade:
          type: array
          items: { $ref: '#/components/schemas/GitMergeCascade' }
        summary:
          type: array
          items: { $ref: '#/components/schemas/GitChangeCount' }
        changes:
          type: array
          description: Изменения результата относительно текущего содержимого.
          items: { $ref: '#/components/schemas/GitChange' }
        marks:
          type: array
          description: Отметки объектов для холста — те же изменения, ключом `archiId`.
          items: { $ref: '#/components/schemas/GitMergeMark' }
        views:
          type: array
          description: Изменённые представления — узлы, которых в текущем содержимом нет.
          items: { $ref: '#/components/schemas/GitMergeView' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }

    GitMergeConflict:
      type: object
      required: [id, kind, archiId, name, field]
      properties:
        id:         { type: string, examples: ["id-2ae470c0df71095e61b6d059:name", "id-2ae470c0df71095e61b6d059:*"] }
        kind:       { type: string, enum: [MODEL, FOLDER, ELEMENT, RELATIONSHIP, VIEW] }
        archiId:    { type: string }
        type:       { type: string, description: "Тип ArchiMate; у папок и модели нет." }
        name:       { type: string }
        field:      { type: string, description: "Поле; `*` — удаление в одной ветви против правки в другой." }
        base:       { type: string, description: "Значение в общем предке; нет — поля нет." }
        ours:       { type: string, description: "«Наше»; удалено — поля нет." }
        theirs:     { type: string, description: "«Их»; удалено — поля нет." }
        resolution: { $ref: '#/components/schemas/GitMergeResolution' }

    GitMergeCascade:
      type: object
      required: [kind, archiId, name, reason]
      properties:
        kind:    { type: string, enum: [FOLDER, ELEMENT, RELATIONSHIP, VIEW, VIEW_NODE, VIEW_CONNECTION] }
        archiId: { type: string }
        name:    { type: string }
        reason:  { type: string, enum: [RELATION_ENDPOINT_REMOVED, DIAGRAM_REFERENCE_REMOVED, CONNECTION_ENDPOINT_REMOVED, FOLDER_CYCLE] }
        viewArchiId: { type: string, description: "Представление узла или ребра." }

    GitMergeMark:
      type: object
      required: [archiId, mark]
      properties:
        archiId: { type: string }
        mark:    { type: string, enum: [ADDED, REMOVED, CHANGED] }

    GitMergeView:
      type: object
      required: [archiId, addedNodes]
      properties:
        archiId: { type: string }
        addedNodes:
          type: array
          items:
            type: object
            required: [archiId, x, y, width, height]
            properties:
              archiId:        { type: string }
              elementArchiId: { type: string }
              type:           { type: string }
              name:           { type: string }
              x:      { type: integer, description: "Абсолютно, от начала холста." }
              y:      { type: integer }
              width:  { type: integer }
              height: { type: integer }

    GitMergeResult:
      type: object
      required: [sessionId, status, modelId, versionNo, created, commitSha]
      properties:
        sessionId: { type: string, format: uuid }
        status:    { type: string, enum: [APPLIED] }
        modelId:   { type: string, format: uuid }
        versionNo: { type: integer, format: int64 }
        created:   { type: boolean, description: "Ложь — результат совпал с текущим, версия прежняя." }
        commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }

    ImportSettings:
      type: object
      required: [strictImport]
      properties:
        strictImport: { type: boolean }

    ImportFinding:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [ERROR, WARNING, INFO] }
        code:     { type: string, examples: ["IXC_UNKNOWN_ELEMENT_TYPE"] }
        message:  { type: string }
        archiId:  { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,254}$' }
        xmlLine:  { type: integer, minimum: 1 }

    LossReport:
      type: object
      description: |
        Отчёт о потерях выгрузки. Отдаётся вместе с артефактом всегда;
        пустой `entries` — валидный отчёт, отсутствие отчёта — нет
        (INV-IXC-006).
      required: [format, sourceVersionNo, entries]
      properties:
        format:          { type: string, enum: [ARCHIMATE, OPEN_EXCHANGE, CSV_CATALOG, SVG, PNG, GIT_YAML] }
        sourceVersionNo: { type: integer, format: int64 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LossEntry' }

    LossEntry:
      type: object
      required: [archiId, objectKind, lostAspect, reason]
      properties:
        archiId:    { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,254}$' }
        objectKind: { type: string, enum: [element, relationship, view, node, edge, property] }
        lostAspect: { type: string }
        reason:     { type: string }

  responses:

    ImageOptionRejected422:
      description: |
        Недопустимый параметр картинки — `IXC_UNKNOWN_FORMAT` или
        `IXC_INVALID_EXPORT_OPTION`; PNG стороной больше 16 000 px (4 000 × 4 000
        при `scale=4`) — `IXC_IMAGE_TOO_LARGE`, наибольшая допустимая плотность
        в поле `maxScale` (0 — не помещается даже при `scale=1`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    UnprocessableEntity422:
      description: |
        Строгий режим и находки уровня ERROR — модель не создана (INV-IXC-007, FR-49).
        `code: IXC_STRICT_IMPORT_REJECTED`, находки — в `findings`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
