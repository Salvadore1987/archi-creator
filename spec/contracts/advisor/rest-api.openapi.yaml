openapi: 3.1.0

info:
  title: Advisor API
  version: 0.2.0
  description: |
    API ИИ-помощника: ревью модели, контекстная подсказка, план модели,
    генерация документации. Все четыре функции отдают ответ потоком
    (`text/event-stream`), первые токены — за 3 с (NFR-04).

    Каждая операция ссылается на use case в `x-use-case` и на операцию таблицы
    доступа в `x-operation` (spec/nfr/advisor.yaml#security.authorization):
    роль проверяется на границе use case'а, а не по URL.

    **Поток.** Отказы (роль, выключатель, бюджет, частота, размер контекста)
    принимаются до открытия потока и приходят обычным `problem+json`: отказ
    не может прийти обрывком потока (INV-ADV-002). Открытый поток состоит из
    кадров SSE: `token` — фрагмент текста, `finding` — находка ревью, `plan` —
    план модели, `answer` — итог подсказки или документации со ссылками,
    последним — `meta` (`SessionMeta`). Сбой внешнего API после открытия
    потока — кадр `meta` с `outcome: FAILED`.

    **Граница, видимая в контракте:** ни одна операция не изменяет модель
    и не возвращает команду изменения (FR-22, INV-ADV-004). `ModelPlan`
    ниже описывает предлагаемые элементы по имени и типу — применить его
    автоматически нечем, и это сделано намеренно.

servers:
  - url: /api/v1
    description: Относительный путь; приложение и фронтенд отдаются одним артефактом.

security:
  - bearerAuth: []

tags:
  - name: advisor
    description: ИИ-помощник. Только чтение модели, только текстовый результат.

paths:

  /ai/review:
    post:
      tags: [advisor]
      operationId: reviewModel
      summary: Ревью модели или представления — поток находок (FR-23)
      x-use-case: UC-ADV-001
      x-operation: ReviewModel
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId: { type: string, format: uuid }
                viewId:  { type: string, format: uuid, description: "Задан — ревью одного представления." }
      responses:
        '200': { $ref: '#/components/responses/Stream200' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
        '413': { $ref: '#/components/responses/ContextTooLarge413' }
        '429': { $ref: '#/components/responses/TooManyRequests429' }
        '503': { $ref: '#/components/responses/Unavailable503' }

  /ai/explain:
    post:
      tags: [advisor]
      operationId: explainElement
      summary: Подсказка по элементу — тип, допустимые связи по матрице, следующий шаг (FR-24)
      x-use-case: UC-ADV-002
      x-operation: ExplainElement
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId, elementId]
              properties:
                modelId:   { type: string, format: uuid }
                elementId: { type: string, description: "archiId элемента." }
      responses:
        '200': { $ref: '#/components/responses/Stream200' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
        '413': { $ref: '#/components/responses/ContextTooLarge413' }
        '429': { $ref: '#/components/responses/TooManyRequests429' }
        '503': { $ref: '#/components/responses/Unavailable503' }

  /ai/plan:
    post:
      tags: [advisor]
      operationId: planModel
      summary: План модели по описанию — описание, а не изменение (FR-25)
      x-use-case: UC-ADV-002
      x-operation: PlanModel
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId, prompt]
              properties:
                modelId: { type: string, format: uuid }
                prompt:  { type: string, maxLength: 4000 }
      responses:
        '200': { $ref: '#/components/responses/Stream200' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
        '413': { $ref: '#/components/responses/ContextTooLarge413' }
        '422': { $ref: '#/components/responses/Unprocessable422' }
        '429': { $ref: '#/components/responses/TooManyRequests429' }
        '503': { $ref: '#/components/responses/Unavailable503' }

  /ai/document:
    post:
      tags: [advisor]
      operationId: generateDocumentation
      summary: Документация в Markdown — модель, представление или влияние элемента (FR-26)
      x-use-case: UC-ADV-002
      x-operation: GenerateDocumentation
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:   { type: string, format: uuid }
                viewId:    { type: string, format: uuid, description: "Описание представления." }
                elementId: { type: string, description: "archiId: анализ влияния при отказе элемента." }
      responses:
        '200': { $ref: '#/components/responses/Stream200' }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '404': { $ref: '#/components/responses/NotFound404' }
        '409': { $ref: '#/components/responses/Conflict409' }
        '413': { $ref: '#/components/responses/ContextTooLarge413' }
        '422': { $ref: '#/components/responses/Unprocessable422' }
        '429': { $ref: '#/components/responses/TooManyRequests429' }
        '503': { $ref: '#/components/responses/Unavailable503' }

  /ai/status:
    get:
      tags: [advisor]
      operationId: advisorStatus
      summary: Включён ли помощник и в каком состоянии бюджет — панель показывается по нему
      x-use-case: UC-ADV-003
      x-operation: AdvisorStatus
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid },
            description: "Без него — пространство по умолчанию." }
      responses:
        '200':
          description: Состояние помощника в пространстве.
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdvisorStatus' } }

  /ai/settings:
    get:
      tags: [advisor]
      operationId: advisorSettings
      summary: Выключатель и месячный лимит пространства
      x-use-case: UC-ADV-003
      x-operation: ToggleAdvisor
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Настройки помощника.
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdvisorSettings' } }
        '403': { $ref: '#/components/responses/Forbidden403' }
    put:
      tags: [advisor]
      operationId: changeAdvisorSettings
      summary: Включить или выключить помощника, задать месячный лимит (FR-27, FR-51)
      x-use-case: UC-ADV-003
      x-operation: SetTokenBudget
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AdvisorSettings' } }
      responses:
        '200':
          description: Настройки сохранены; бюджет текущего месяца пересчитан от нового лимита.
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdvisorSettings' } }
        '403': { $ref: '#/components/responses/Forbidden403' }
        '422': { $ref: '#/components/responses/Unprocessable422' }

  /ai/usage:
    get:
      tags: [advisor]
      operationId: tokenUsage
      summary: Расход за месяц по пользователям и функциям (FR-53)
      x-use-case: UC-ADV-003
      x-operation: ViewTokenUsage
      parameters:
        - { in: query, name: workspaceId, required: false, schema: { type: string, format: uuid } }
        - { in: query, name: period, required: false, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' },
            description: "Месяц YYYY-MM; без него — текущий." }
      responses:
        '200':
          description: Расход и состояние бюджета.
          content:
            application/json: { schema: { $ref: '#/components/schemas/TokenUsageReport' } }
        '403': { $ref: '#/components/responses/Forbidden403' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, maxLength: 64 }
      description: |
        Повтор с тем же ключом возвращает результат существующей сессии и
        не тратит токены заново. См. INV-ADV-003.

  schemas:

    Problem:
      type: object
      description: RFC 7807 Problem Details + поле `code` (docs/backend.md §8.1).
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        code:
          type: string
          description: |
            Код отказа: `ADVISOR_DISABLED`, `BUDGET_EXHAUSTED`, `RATE_LIMITED`,
            `CONTEXT_TOO_LARGE`, `ADVISOR_UNAVAILABLE`, `INV-ADV-003` (тот же ключ
            с другими параметрами), `ADV_NOT_FOUND`, `ADV_INVALID_INPUT`, `ACCESS_DENIED`.
          examples: ["ADVISOR_DISABLED", "BUDGET_EXHAUSTED"]
        resetsAt:
          type: string
          format: date
          description: Только у `BUDGET_EXHAUSTED` — первый день следующего месяца.

    ElementRef:
      type: object
      description: |
        Ссылка на объект модели — единственный способ, которым помощник на
        неё указывает (INV-ADV-008).
      required: [archiId, name]
      properties:
        archiId: { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,254}$' }
        name:    { type: string }

    Finding:
      type: object
      description: Находка ревью (FR-23). Формат общий с отчётом валидации modeling.
      required: [severity, code, message, targetKind, target]
      properties:
        severity:   { type: string, enum: [ERROR, WARNING, INFO] }
        code:       { type: string, examples: ["ORPHAN_ELEMENT", "RELATION_NOT_PERMITTED"] }
        message:    { type: string }
        targetKind: { type: string, enum: [ELEMENT, RELATIONSHIP, VIEW, MODEL] }
        target:     { $ref: '#/components/schemas/ElementRef' }
        suggestion: { type: string, description: Описание исправления. }

    ModelPlan:
      type: object
      description: |
        Результат `/ai/plan`. **Изменений в модель не вносит** (FR-25).
        Элементы описаны именем и типом, идентификаторов создаваемых
        объектов здесь нет — применить план автоматически нечем.
      required: [elements, relationships]
      properties:
        elements:
          type: array
          items:
            type: object
            required: [archiType, name]
            properties:
              archiType:   { type: string, examples: ["archimate:ApplicationService"] }
              name:        { type: string }
              existingRef: { $ref: '#/components/schemas/ElementRef' }
        relationships:
          type: array
          items:
            type: object
            required: [archiType, sourceName, targetName, permitted]
            properties:
              archiType:  { type: string, examples: ["archimate:RealizationRelationship"] }
              sourceName: { type: string }
              targetName: { type: string }
              permitted:
                type: boolean
                description: false — связь недопустима по матрице ArchiMate и требует внимания.
        notes: { type: string }

    SessionMeta:
      type: object
      description: |
        Служебное событие потока: завершение сессии и её стоимость.
        Приходит последним кадром SSE.
      required: [sessionId, outcome, promptTokens, completionTokens, contextTruncated]
      properties:
        sessionId:        { type: string, format: uuid }
        outcome:          { type: string, enum: [COMPLETED, FAILED, REJECTED] }
        rejectionReason:  { type: string, enum: [ADVISOR_DISABLED, BUDGET_EXHAUSTED, RATE_LIMITED, CONTEXT_TOO_LARGE, MODEL_DELETED] }
        promptTokens:     { type: integer, format: int64, minimum: 0 }
        completionTokens: { type: integer, format: int64, minimum: 0 }
        contextTruncated:
          type: boolean
          description: |
            Контекст был усечён по лимиту размера — ответ построен не по
            всей модели (INV-ADV-007).

    AdvisorAnswer:
      type: object
      description: Итог подсказки и документации (кадр `answer`). Ссылки — отдельно, чтобы их можно было открыть.
      required: [markdown, references]
      properties:
        markdown:   { type: string }
        references: { type: array, items: { $ref: '#/components/schemas/ElementRef' } }

    AdvisorStatus:
      type: object
      required: [workspaceId, enabled, budgetStatus, period, resetsAt]
      properties:
        workspaceId:  { type: string, format: uuid }
        enabled:      { type: boolean }
        budgetStatus: { type: string, enum: [OK, WARNING, EXHAUSTED] }
        period:       { type: string, examples: ["2026-10"] }
        resetsAt:     { type: string, format: date }

    AdvisorSettings:
      type: object
      required: [enabled, monthlyTokenLimit]
      properties:
        enabled:           { type: boolean }
        monthlyTokenLimit: { type: integer, format: int64, minimum: 1 }

    TokenUsageReport:
      type: object
      required: [period, limitTokens, consumedTokens, budgetStatus, byUser, byFunction]
      properties:
        period:         { type: string }
        limitTokens:    { type: integer, format: int64 }
        consumedTokens: { type: integer, format: int64 }
        budgetStatus:   { type: string, enum: [OK, WARNING, EXHAUSTED] }
        byUser:
          type: array
          items: { $ref: '#/components/schemas/UsageRow' }
        byFunction:
          type: array
          items: { $ref: '#/components/schemas/UsageRow' }

    UsageRow:
      type: object
      required: [key, requests, rejected, promptTokens, completionTokens]
      properties:
        key:              { type: string, description: "subject пользователя или функция REVIEW/EXPLAIN/PLAN/DOCUMENT." }
        requests:         { type: integer }
        rejected:         { type: integer }
        promptTokens:     { type: integer, format: int64 }
        completionTokens: { type: integer, format: int64 }

  responses:

    Stream200:
      description: Поток SSE; последним кадром — `meta` (`SessionMeta`).
      content:
        text/event-stream:
          schema: { type: string }

    NotFound404:
      description: Модели, представления или элемента нет — или они скрыты списком доступа.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Conflict409:
      description: Тот же `Idempotency-Key` с другими параметрами или сессия с ним ещё идёт (INV-ADV-003).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Unprocessable422:
      description: Запрос сам по себе недопустим — пустое описание, длиннее предела.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ContextTooLarge413:
      description: |
        Контекст не помещается даже усечённым — выберите представление вместо
        всей модели (`CONTEXT_TOO_LARGE`, INV-ADV-007).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Unavailable503:
      description: Anthropic API недоступен до открытия потока (`ADVISOR_UNAVAILABLE`); редактор работает.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Forbidden403:
      description: |
        Помощник выключен администратором рабочего пространства
        (`ADVISOR_DISABLED`, INV-ADV-005) или роль не даёт права на операцию
        (`ACCESS_DENIED`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    TooManyRequests429:
      description: |
        Месячный бюджет исчерпан (`BUDGET_EXHAUSTED`, поле `resetsAt`, FR-51)
        или превышена частота обращений (`RATE_LIMITED`, FR-52, INV-ADV-007).
      headers:
        Retry-After:
          description: Секунды до следующей попытки; только у `RATE_LIMITED`.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
