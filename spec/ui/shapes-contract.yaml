# ───────────────────────────────────────────────────────────────────
# Контракт общей геометрии фигур: shapes.json + спрайт иконок.
#
# Зачем контракт, а не значения. FR-42 требует, чтобы геометрия задавалась
# ОДИН раз и использовалась и канвой, и серверным писателем SVG (§6.10).
# Спека фиксирует форму этого файла и правила, по которым он читается;
# сами координаты рождаются из макетов и живут в реализации. Числа в спеке
# означали бы, что их правка требует правки спецификации при каждом
# подкручивании скругления.
#
# Расхождение канвы и серверного SVG ловится визуальными тестами (§9.4).
# ───────────────────────────────────────────────────────────────────

artifact:
  path: общий ресурс сборки, доступен и фронтенду, и серверу
  format: JSON
  single_source: true
  consumers:
    - канва React Flow — узлы рисуются инлайн-SVG по этим контурам
    - SvgWriter на сервере — экспорт представления в SVG и PNG (FR-41)
  forbidden: |
    Рисовать силуэт средствами CSS (border-radius, clip-path, псевдоэлементы).
    CSS-фигуру серверный писатель воспроизвести не может, и экспорт разойдётся
    с экраном. Решение принято 2026-09-22, ADR-0007.

coordinate_system:
  origin: левый верхний угол фигуры
  units: пользовательские единицы SVG, 1 = 1 px при масштабе 100 %
  viewbox: описывается в нормализованном боксе, растягивается под bounds узла
  bounds_source: |
    Размер и положение узла берутся из ViewNode.bounds
    (../domain/modeling/aggregates.yaml#Bounds) и относительны родителю;
    у детей Group — относительно группы.

# Обязательные поля записи одного силуэта.
shape_entry:
  key:
    type: String
    rule: значение ArchiType из ../domain/modeling/aggregates.yaml#ArchiType
  outline:
    type: String
    rule: |
      Путь SVG или имя примитива. Силуэт обязан совпадать с ArchiMate —
      это семантика нотации, а не оформление (UI-009).
  corner_icon:
    type: Object
    fields: [sprite_id, x, y, size]
    rule: |
      Позиция угловой иконки — часть узнаваемости типа, менять нельзя.
      Размер иконки 14×14 (docs/frontend.md §6.3).
  label_box:
    type: Object
    fields: [x, y, width, height]
    rule: |
      Область подписи. Имя переносится на одну-две строки, на третьей
      обрезается многоточием.
  radius_token:
    type: String
    rule: |
      Ссылка на токен формы из design-tokens.yaml (node_radius либо
      node_radius_round для поведенческих элементов), а не число.
  layer:
    type: String
    rule: |
      Слой, из которого берутся цвета заливки и обводки. Собственный стиль
      объекта его перекрывает (FR-21, UI-011).

icon_sprite:
  format: SVG-спрайт, ссылка по sprite_id
  requirement: |
    Один и тот же спрайт используется канвой и серверным писателем. Иконки
    векторные: растр в PNG-экспорте появляется только на последнем шаге
    растеризации из SVG.

completeness:
  rule: |
    Для каждого ArchiType фазы 1 (Business, Application, Technology) запись
    обязательна. Типы фаз 2 и 3 до их поддержки рисуются силуэтом заглушки
    и остаются перемещаемыми, но семантически не редактируются (UI-020, FR-03).

docs_ref: docs/backend.md#610-экспорт-представлений
