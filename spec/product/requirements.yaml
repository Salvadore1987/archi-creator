# ───────────────────────────────────────────────────────────────────
# Реестр требований Archi Creator — НОРМАТИВНЫЙ источник.
#
# До 2026-09-28 требования объявлялись в docs/archi-creator.md §2.
# Теперь наоборот: формулировка живёт здесь, §2 держит таблицу-индекс
# для навигации и ссылается сюда. Расхождение = дефект docs/.
#
# Поля:
#   title      — короткое имя для таблиц и разговора
#   owner      — кто отвечает: modeling | interchange | advisor | ui | cross-cutting
#                ui — слой, а не bounded context: у него нет агрегатов и событий,
#                он проекция modeling; cross-cutting — применяется во всех.
#   stages     — этапы docs/archi-creator.md §12, на которых требование реализуется
#   statement  — нормативная формулировка, дословно
#   anchors    — якоря спеки, в которых требование получило исполнимую форму
#                (INV-*, UC-*, UI-*). Пустой список = требование не проверяемо,
#                это дефект, который ловит tools/check-traceability.py
#   docs_ref   — где обоснование и подробности
# ───────────────────────────────────────────────────────────────────

functional:

  # ── Работа с моделями ──────────────────────────────────────────

  FR-01:
    title: Импорт `.archimate`
    owner: interchange
    stages: ["1", "2"]
    statement: |
      Импорт файла `.archimate` (нативный формат Archi,
      `xmlns:archimate="http://www.archimatetool.com/archimate"`, `version="5.0.0"`)
      с сохранением всей структуры: папок, вложенных папок, id, свойств
      (`property key/value`), документации.
    anchors: [INV-IXC-001, INV-IXC-003, UC-IXC-001]
    docs_ref: docs/backend.md#34-кодек-archimate--ключевые-решения

  FR-02:
    title: Lossless round-trip
    owner: interchange
    stages: ["1", "2"]
    statement: |
      Экспорт модели обратно в `.archimate` с lossless round-trip: цикл
      «открыть → ничего не менять → сохранить» даёт XML, семантически
      идентичный исходному.
    anchors: [INV-IXC-004, INV-IXC-005, UC-IXC-002]
    docs_ref: docs/backend.md#91-golden-file-тесты-round-trip--критический-контур

  FR-03:
    title: Неподдержанное сохраняется как есть
    owner: interchange
    participates: [modeling, ui]
    stages: ["1", "3"]
    statement: |
      Элементы и связи, не поддерживаемые текущей фазой метамодели, сохраняются
      «как есть» (opaque-узлы) и корректно отдаются при экспорте. Они отображаются
      на канве и доступны для перемещения, но не редактируются семантически.
    anchors: [INV-IXC-001, INV-IXC-005, UI-020]
    docs_ref: docs/backend.md#34-кодек-archimate--ключевые-решения

  FR-04:
    title: Жизненный цикл модели
    owner: modeling
    stages: ["2"]
    statement: |
      Список моделей рабочего пространства, создание пустой модели, переименование,
      удаление (soft delete).
    anchors: [INV-MDL-002, UC-MDL-001]
    docs_ref: docs/backend.md#5-rest-api

  FR-05:
    title: Блокировка модели на редактирование
    owner: modeling
    stages: ["2"]
    statement: |
      Блокировка модели на редактирование: один редактор одновременно, остальные
      видят её read-only. Admin может снять блокировку принудительно.
    anchors: [INV-MDL-006, UC-MDL-005]
    docs_ref: docs/backend.md#5-rest-api

  FR-06:
    title: История версий и откат
    owner: modeling
    stages: ["2"]
    statement: |
      История версий: каждое сохранение создаёт версию с автором, временем
      и комментарием; доступен просмотр и откат к версии.
    anchors: [INV-MDL-010, UC-MDL-004]
    docs_ref: docs/database.md#44-хранение-и-очистка-версий

  # ── Метамодель ─────────────────────────────────────────────────

  FR-07:
    title: Фаза 1 — Business, Application, Technology
    owner: modeling
    stages: ["1"]
    statement: |
      Фаза 1: полная поддержка слоёв Business, Application, Technology —
      создание, редактирование, валидация.
    anchors: [INV-MDL-007, UC-MDL-002]
    docs_ref: docs/archi-creator.md#12-этапы-работ

  FR-08:
    title: Фазы 2 и 3 метамодели
    owner: modeling
    stages: ["1", "6"]
    statement: |
      Фаза 2: Motivation и Strategy. Фаза 3: Physical, Implementation & Migration.
      До этого их элементы обрабатываются по FR-03.
    anchors: [INV-MDL-009, UI-020]
    docs_ref: docs/archi-creator.md#12-этапы-работ

  FR-09:
    title: Типы связей ArchiMate
    owner: modeling
    stages: ["1"]
    statement: |
      Поддержка типов связей: Composition, Aggregation, Assignment, Realization,
      Serving, Access, Influence, Triggering, Flow, Specialization, Association.
    anchors: [INV-MDL-007, UC-MDL-003]
    docs_ref: docs/archi-creator.md#12-этапы-работ

  FR-10:
    title: Матрица допустимых связей
    owner: modeling
    stages: ["1", "4"]
    statement: |
      Матрица допустимых связей ArchiMate 3.2 применяется при рисовании связи:
      недопустимые типы не предлагаются. Модели, импортированные с нарушениями,
      не блокируются — нарушения попадают в отчёт валидации.
    anchors: [INV-MDL-007, INV-IXC-007, UC-MDL-003, UI-003]
    docs_ref: docs/backend.md#83-строгость-импорта

  FR-11:
    title: Модель и представление разделены
    owner: modeling
    participates: [ui]
    stages: ["2", "3"]
    statement: |
      Разделение модели и представления: элемент существует один раз в модели,
      размещается в произвольном числе представлений. Переименование элемента
      отражается во всех представлениях.
    anchors: [INV-MDL-008, UI-001]
    docs_ref: docs/database.md#4-модель-данных

  # ── Канва и редактирование ─────────────────────────────────────

  FR-12:
    title: Drag-and-drop на канву
    owner: ui
    stages: ["3"]
    statement: |
      Drag-and-drop элемента из палитры на канву и из дерева модели на канву
      (повторное размещение существующего элемента).
    anchors: [UI-002, UC-MDL-002]
    docs_ref: docs/frontend.md#65-компоновка-главного-экрана--решение-принято

  FR-13:
    title: Умное рисование связи
    owner: ui
    participates: [modeling]
    stages: ["4"]
    statement: |
      Умное рисование связи: тянем от границы элемента к другому, показывается
      список допустимых типов связи для этой пары, наиболее вероятный выбран
      по умолчанию.
    anchors: [UI-003, INV-MDL-007, UC-MDL-003]
    docs_ref: docs/frontend.md#6-визуальный-язык

  FR-14:
    title: Вложенность и подразумеваемая связь
    owner: ui
    participates: [modeling]
    stages: ["4"]
    statement: |
      Вложенность (containment): при помещении элемента внутрь другого создаётся
      подразумеваемая связь (composition/assignment по типу пары), дети
      перемещаются вместе с родителем.
    anchors: [UI-004, INV-MDL-008]
    docs_ref: docs/frontend.md#6-визуальный-язык

  FR-15:
    title: Авторазметка представления
    owner: ui
    stages: ["4"]
    statement: |
      Авторазметка представления: раскладка по слоям ArchiMate (бизнес сверху,
      технологии снизу) с минимизацией пересечений связей.
    anchors: [UI-005]
    docs_ref: docs/frontend.md#6-визуальный-язык

  FR-16:
    title: Паритет редактирования с Archi
    owner: ui
    stages: ["3", "4"]
    statement: |
      Паритет с Archi по базовому редактированию: undo/redo, множественный выбор
      и рамка выделения, копирование/вставка, выравнивание и направляющие, точки
      перегиба связей (bend points), zoom/pan, сетка и привязка, группы (`Group`)
      и заметки (`Note`), соединители (`Junction`), переопределение стиля отдельного
      объекта (цвет заливки, шрифт), навигатор/структура модели, поиск по модели,
      «где используется».
    anchors: [UI-006, UI-017]
    docs_ref: docs/frontend.md#69-история-изменений

  FR-17:
    title: Панель свойств
    owner: ui
    stages: ["3"]
    statement: |
      Панель свойств выбранного объекта: имя, документация, произвольные свойства
      key/value, слой, тип, стиль.
    anchors: [UI-007]
    docs_ref: docs/frontend.md#67-вкладка-описание-правая-панель

  FR-18:
    title: Вкладки представлений
    owner: ui
    stages: ["3"]
    statement: |
      Вкладки открытых представлений; в одной модели одновременно открыто
      несколько представлений.
    anchors: [UI-008]
    docs_ref: docs/frontend.md#65-компоновка-главного-экрана--решение-принято

  FR-30:
    title: Дерево модели
    owner: ui
    stages: ["3"]
    statement: |
      Дерево модели (левая панель): папки из файла с исходной вложенностью,
      счётчики по ветвям, три режима группировки (папки / типы / плоский список),
      живой поиск с подсветкой и авторазвёрткой совпадений, фильтры «на текущем
      представлении», «не размещены», «с замечаниями», маркеры на элементе
      (не размещён / есть находка / число представлений), двусторонняя синхронизация
      выделения с холстом и панелью свойств.
    anchors: [UI-012]
    docs_ref: docs/frontend.md#66-дерево-модели-левая-панель

  FR-31:
    title: Виртуализация дерева
    owner: ui
    stages: ["3"]
    statement: |
      Дерево виртуализировано: в ветви одновременно рендерится не более 50 строк,
      остальные по «показать ещё». На 2 000 элементов (NFR-01) отклик поиска
      ≤ 100 мс.
    anchors: [UI-013]
    docs_ref: docs/frontend.md#66-дерево-модели-левая-панель

  FR-32:
    title: Вкладка «Описание»
    owner: ui
    stages: ["3"]
    statement: |
      Вкладка «Описание» в правой панели рядом со «Свойствами»: читаемая карточка
      элемента — документация, полный список связей с направлением и русскими
      названиями типов, анализ влияния, свойства, перечень представлений.
      Переходы по связям навигируют между элементами.
    anchors: [UI-014]
    docs_ref: docs/frontend.md#67-вкладка-описание-правая-панель

  FR-33:
    title: Интерфейс зависит от роли
    owner: ui
    participates: [cross-cutting]
    stages: ["3"]
    statement: |
      Интерфейс зависит от роли: для `VIEWER` правая панель открывается на вкладке
      «Описание», поля вкладки «Свойства» только для чтения, инструменты
      редактирования и палитра скрыты, освободившееся место отдаётся дереву модели.
      Экспорт и помощник остаются доступны. Для `ARCHITECT` и `ADMIN` по умолчанию
      открыта вкладка «Свойства».
    anchors: [UI-015, UI-018]
    docs_ref: docs/frontend.md#67-вкладка-описание-правая-панель

  FR-34:
    title: Редактирование дерева
    owner: ui
    participates: [modeling]
    stages: ["3"]
    statement: |
      Редактирование дерева: переименование элементов и папок по F2 или двойному
      клику прямо в строке; перемещение элементов между папками перетаскиванием
      и через «Переместить в папку…» с поиском по пути; создание вложенных папок;
      удаление с предварительной проверкой связей; множественное выделение
      (Ctrl/Cmd — переключение, Shift — диапазон) и групповые операции над выбранным.
    anchors: [UI-016, INV-MDL-004, INV-MDL-009, UC-MDL-006]
    docs_ref: docs/frontend.md#68-редактирование-дерева

  FR-35:
    title: Многошаговая история изменений
    owner: ui
    stages: ["3", "4"]
    statement: |
      Многошаговая история изменений: отмена и повтор на любую глубину сессии
      (`Ctrl/Cmd+Z`, `Ctrl/Cmd+Shift+Z`, `Ctrl+Y`, кнопки на панели инструментов).
      Панель истории показывает список операций, текущую позицию и точку сохранения;
      клик по строке возвращает модель в это состояние. Изменённые относительно точки
      сохранения элементы помечены в дереве, счётчик несохранённых изменений виден
      в статус-строке, кнопка «Сохранить» появляется только при их наличии.
    anchors: [UI-017]
    docs_ref: docs/frontend.md#69-история-изменений

  FR-36:
    title: Контекстное меню по роли
    owner: ui
    participates: [modeling]
    stages: ["3"]
    statement: |
      Контекстное меню зависит от роли: `ARCHITECT`/`ADMIN` получают полный набор
      действий, `VIEWER` — только неизменяющие пункты («Показать на представлении»,
      «Где используется», «Копировать имя»). Системные папки формата (`Strategy`,
      `Business`, `Application`, `Technology`, `Motivation`, `Other`, `Relations`,
      `Views`) удалению не подлежат.
    anchors: [UI-018, INV-MDL-009]
    docs_ref: docs/frontend.md#68-редактирование-дерева

  # ── Визуальный язык ────────────────────────────────────────────

  FR-19:
    title: Стиль «modern flat»
    owner: ui
    stages: ["3"]
    statement: |
      Новый визуальный стиль «modern flat»: силуэты фигур и позиции угловых иконок
      совпадают с ArchiMate, меняется оформление — скругления, цветовые токены слоя,
      тонкая обводка, мягкая тень, типографская иерархия, векторные иконки.
      Архитектор, знакомый с Archi, узнаёт каждую фигуру.
    anchors: [UI-009]
    docs_ref: docs/frontend.md#61-принцип

  FR-20:
    title: Единая таблица токенов стиля
    owner: ui
    stages: ["3"]
    statement: |
      Единая таблица токенов стиля (цвет, радиус, тень, шрифт, размеры) —
      источник правды для канвы и экспорта.
    anchors: [UI-010]
    docs_ref: docs/frontend.md#62-токены

  FR-21:
    title: Собственный стиль объекта приоритетнее токена
    owner: ui
    participates: [interchange]
    stages: ["1", "3"]
    statement: |
      Если у импортированного объекта задан собственный цвет/шрифт (`fillColor`,
      `font`), он имеет приоритет над токеном слоя и сохраняется при экспорте.
    anchors: [UI-011, INV-IXC-005]
    docs_ref: docs/frontend.md#62-токены

  # ── ИИ-помощник ────────────────────────────────────────────────

  FR-22:
    title: Помощник не изменяет модель
    owner: advisor
    stages: ["5"]
    statement: |
      Помощник не изменяет модель. Любые его результаты — текст, ссылки на элементы
      и подсказки; изменения вносит только архитектор.
    anchors: [INV-ADV-004, UC-ADV-001, UC-ADV-002]
    docs_ref: docs/backend.md#7-ии-помощник

  FR-23:
    title: Ревью модели
    owner: advisor
    stages: ["5"]
    statement: |
      Ревью модели: поиск нарушений матрицы связей, элементов-сирот, дублирующихся
      по смыслу элементов, пропущенных связей между слоями, несогласованных имён.
      Каждая находка ссылается на элемент («Перейти к элементу») и содержит описание
      исправления.
    anchors: [INV-ADV-008, UC-ADV-001]
    docs_ref: docs/backend.md#7-ии-помощник

  FR-24:
    title: Контекстная подсказка
    owner: advisor
    stages: ["5"]
    statement: |
      Контекстная подсказка: для выбранного элемента — объяснение типа, список
      допустимых связей отсюда, предложение следующего шага моделирования.
    anchors: [INV-ADV-004, UC-ADV-002]
    docs_ref: docs/backend.md#7-ии-помощник

  FR-25:
    title: План модели по описанию
    owner: advisor
    stages: ["5"]
    statement: |
      Генерация по текстовому описанию возвращает структурированный план модели
      (список элементов с типами и список связей), а не изменения. Палитра
      фильтруется по предложенным типам, чтобы архитектор собрал схему быстро.
    anchors: [INV-ADV-004, UC-ADV-002]
    docs_ref: docs/backend.md#7-ии-помощник

  FR-26:
    title: Генерация документации
    owner: advisor
    stages: ["5"]
    statement: |
      Генерация документации: описание представления, каталог элементов, анализ
      влияния («что затронуто при отказе компонента») с выгрузкой в Markdown.
    anchors: [INV-ADV-004]
    docs_ref: docs/backend.md#7-ии-помощник

  FR-27:
    title: Выключение помощника и аудит
    owner: advisor
    stages: ["5"]
    statement: |
      ИИ-функции отключаются администратором на уровне рабочего пространства
      (`workspace.ai_enabled`). Каждое обращение пишется в аудит.
    anchors: [INV-ADV-001, INV-ADV-005, UC-ADV-001]
    docs_ref: docs/backend.md#7-ии-помощник

  # ── Доступ ─────────────────────────────────────────────────────

  FR-28:
    title: Аутентификация и роли
    owner: cross-cutting
    stages: ["0", "2"]
    statement: |
      Аутентификация через Keycloak/OIDC. Роли: `VIEWER` (чтение, экспорт),
      `ARCHITECT` (редактирование, захват блокировки, импорт), `ADMIN` (рабочие
      пространства, пользователи, принудительное снятие блокировки).
    anchors: [INV-MDL-006, UI-015, UI-018]
    docs_ref: docs/backend.md#5-rest-api

  FR-29:
    title: ACL на уровне модели
    owner: cross-cutting
    stages: ["2"]
    statement: |
      ACL на уровне модели поверх ролей: доступ к конкретным моделям может быть
      ограничен списком пользователей/групп.
    anchors: [INV-MDL-011, UC-MDL-007]
    docs_ref: docs/backend.md#5-rest-api

  # ── Git-интеграция ─────────────────────────────────────────────

  FR-37:
    title: Экспорт в Git
    owner: interchange
    stages: ["7a"]
    statement: |
      Экспорт в Git: сохранение модели создаёт коммит в репозитории рабочего
      пространства в разложенном YAML-формате. Автор коммита — архитектор,
      сообщение — комментарий к сохранению. Если HEAD ветки сдвинулся, экспорт
      помечается как расхождение и не перезаписывает чужой коммит.
    anchors: [INV-IXC-008, INV-IXC-009, UC-IXC-003]
    docs_ref: docs/backend.md#113-направление-обмена

  FR-38:
    title: Импорт из Git по ссылке
    owner: interchange
    stages: ["7b"]
    statement: |
      Импорт из Git: загрузка состояния по ссылке (коммит, тег, ветка) как новой
      версии модели с предварительным отчётом об изменениях и применением одной
      транзакцией.
    anchors: [INV-IXC-012]
    docs_ref: docs/backend.md#113-направление-обмена

  FR-39:
    title: Слияние по сущностям
    owner: interchange
    stages: ["7c"]
    statement: |
      Слияние по сущностям: при разошедшейся базе три состояния (merge-base, наше,
      их) сравниваются по стабильным идентификаторам; непересекающиеся правки
      сливаются автоматически, конфликты разрешает архитектор по полям. Текстовое
      слияние YAML запрещено через `.gitattributes`.
    anchors: [INV-IXC-010]
    docs_ref: docs/backend.md#114-слияние-по-сущностям-а-не-по-тексту

  FR-40:
    title: Детерминированный писатель Git-формата
    owner: interchange
    stages: ["7a"]
    statement: |
      Писатель Git-формата детерминирован: повторный экспорт без изменений модели
      даёт побайтово тот же результат. Проверяется автоматически.
    anchors: [INV-IXC-004, INV-IXC-011, UC-IXC-003]
    docs_ref: docs/backend.md#112-формат-разложенный-yaml

  # ── Экспорт представлений ──────────────────────────────────────

  FR-41:
    title: Серверный экспорт представления в SVG и PNG
    owner: interchange
    stages: ["5a"]
    statement: |
      Серверный экспорт представления в SVG и PNG. Сервер собирает SVG из данных
      представления (без участия браузера пользователя), PNG растеризует из того же
      SVG. Доступно роли `VIEWER`. Пакетный экспорт всех представлений модели
      одним архивом.
    anchors: [INV-IXC-008, UI-019]
    docs_ref: docs/backend.md#610-экспорт-представлений

  FR-42:
    title: Общая геометрия фигур и иконок
    owner: ui
    participates: [interchange]
    stages: ["3", "5a"]
    statement: |
      Геометрия фигур и иконки задаются один раз в общей спецификации
      (`shapes.json` + спрайт иконок) и используются и канвой, и серверным
      писателем. Расхождение экрана и файла ловится визуальными тестами.
    anchors: [UI-019]
    docs_ref: docs/backend.md#610-экспорт-представлений

  # ── Экспорт в Open Exchange Format ─────────────────────────────

  FR-43:
    title: Экспорт в OEF с проверкой по XSD
    owner: interchange
    stages: ["6a"]
    statement: |
      Экспорт в The Open Group ArchiMate Model Exchange File Format. Выгружаемый
      файл проверяется по официальной XSD перед отдачей: невалидный результат
      не отдаётся, а считается ошибкой сервера. Импорта из OEF нет — единственный
      принимаемый формат остаётся `.archimate` (FR-01).
    anchors: [INV-IXC-006]
    docs_ref: docs/backend.md#35-экспорт-в-open-exchange-format

  FR-44:
    title: OEF — best-effort с отчётом о потерях
    owner: interchange
    stages: ["6a"]
    statement: |
      Экспорт в OEF — best-effort, а не lossless: гарантия round-trip остаётся
      только у `.archimate` (FR-02). Каждая выгрузка сопровождается отчётом о том,
      что отображено с потерями или отброшено.
    anchors: [INV-IXC-006]
    docs_ref: docs/backend.md#35-экспорт-в-open-exchange-format

  # ── Каталог в CSV ──────────────────────────────────────────────

  FR-45:
    title: Экспорт каталога в CSV
    owner: interchange
    stages: ["2"]
    statement: |
      Экспорт каталога модели в CSV — элементы и связи двумя файлами в архиве,
      для работы вне редактора (согласование с владельцами систем, аудит,
      отчётность). Импорта CSV нет. Доступно роли `VIEWER`.
    anchors: [INV-IXC-008]
    docs_ref: docs/backend.md#52-экспорт-каталога-в-csv

  # ── Хранение версий ────────────────────────────────────────────

  FR-46:
    title: Записи о версиях бессрочно, снимки по ретеншену
    owner: modeling
    participates: [interchange]
    stages: ["2", "7a"]
    statement: |
      Записи о версиях хранятся бессрочно, тяжёлые снимки — по правилу ретеншена:
      последние 30 дней, все помеченные версии, последняя версия каждого месяца.
      Очищенный снимок восстанавливается из Git по `git_sha` прозрачно
      для пользователя.
    anchors: [INV-MDL-010]
    docs_ref: docs/database.md#44-хранение-и-очистка-версий

  FR-47:
    title: Очистка снимков только при настроенном Git
    owner: modeling
    participates: [interchange]
    stages: ["7a"]
    statement: |
      Очистка снимков включается только для рабочего пространства с настроенным
      и доступным репозиторием. Без Git снимки не удаляются никогда:
      восстанавливать было бы неоткуда.
    anchors: [INV-MDL-010]
    docs_ref: docs/backend.md#115-реализация

  FR-48:
    title: Помеченные версии не удаляются
    owner: modeling
    stages: ["2"]
    statement: |
      Версию можно пометить (`label`) — помеченные версии считаются релизами
      архитектуры, их снимки не удаляются.
    anchors: [INV-MDL-010, UC-MDL-004]
    docs_ref: docs/database.md#44-хранение-и-очистка-версий

  # ── Строгость импорта ──────────────────────────────────────────

  FR-49:
    title: Настройка строгости импорта
    owner: interchange
    stages: ["2"]
    statement: |
      Строгость импорта настраивается на рабочем пространстве (`strict_import`,
      меняет только `ADMIN`). Выключено (по умолчанию): модель с нарушениями
      матрицы связей импортируется, нарушения попадают в отчёт валидации
      и в фильтр «Замечания» дерева. Включено: импорт отклоняется целиком
      со списком нарушений, модель не создаётся.
    anchors: [INV-IXC-007, UC-IXC-001]
    docs_ref: docs/backend.md#83-строгость-импорта

  FR-50:
    title: Битый файл отклоняется всегда
    owner: interchange
    stages: ["1", "2"]
    statement: |
      Битый файл отклоняется всегда, независимо от `strict_import`: невалидный XML,
      ссылка на несуществующий элемент, дубль идентификатора, связь без одного
      из концов. Это не вопрос строгости методологии, а повреждённые данные.
    anchors: [INV-IXC-007, UC-IXC-001]
    docs_ref: docs/backend.md#83-строгость-импорта

  # ── Лимиты ИИ ──────────────────────────────────────────────────

  FR-51:
    title: Месячный бюджет токенов
    owner: advisor
    stages: ["5"]
    statement: |
      Месячный бюджет токенов на рабочее пространство (`ai_monthly_token_limit`).
      На 80 % — предупреждение администратору, на 100 % — `/ai/**` отвечает `429`
      до начала следующего месяца. Остальной редактор работает без изменений.
    anchors: [INV-ADV-005, INV-ADV-006]
    docs_ref: docs/backend.md#75-лимиты-расходов

  FR-52:
    title: Частота запросов и граница контекста
    owner: advisor
    stages: ["5"]
    statement: |
      Ограничение частоты на пользователя и верхняя граница контекста одного
      запроса — защита от зацикливания клиента и от выбора месячного бюджета
      за минуты.
    anchors: [INV-ADV-007]
    docs_ref: docs/backend.md#75-лимиты-расходов

  FR-53:
    title: Расход виден администратору
    owner: advisor
    stages: ["5"]
    statement: |
      Текущий расход (токены, запросы, доля бюджета) виден администратору
      в настройках рабочего пространства в разрезе месяца, пользователя
      и функции помощника.
    anchors: [INV-ADV-001, INV-ADV-006]
    docs_ref: docs/backend.md#75-лимиты-расходов

non_functional:

  NFR-01:
    title: Размер модели без деградации
    owner: ui
    stages: ["3"]
    statement: |
      Модель до 2 000 элементов и 500 объектов на представление редактируется
      без деградации: pan/zoom — 60 fps, открытие представления ≤ 1 с
      при прогретом кэше.
    anchors: [UI-013]
    docs_ref: docs/frontend.md#66-дерево-модели-левая-панель

  NFR-02:
    title: Время импорта
    owner: interchange
    stages: ["1", "2"]
    statement: |
      Импорт файла на 5 000 строк XML — ≤ 3 с на сервере.
    anchors: [UC-IXC-001]
    docs_ref: docs/backend.md#34-кодек-archimate--ключевые-решения

  NFR-03:
    title: Отклик REST API
    owner: cross-cutting
    stages: ["2"]
    statement: |
      Отклик REST API (кроме ИИ и импорта) — p95 ≤ 300 мс.
    anchors: []
    docs_ref: docs/backend.md#5-rest-api
    note: |
      Численные цели разложены по контекстам в spec/nfr/<bc>.yaml; отдельного
      якоря у требования нет — его проверяет нагрузочный профиль, а не инвариант.

  NFR-04:
    title: Потоковый ответ помощника
    owner: advisor
    stages: ["5"]
    statement: |
      Ответ ИИ-помощника — потоковый (SSE), первые токены ≤ 3 с.
    anchors: [UC-ADV-001]
    docs_ref: docs/backend.md#7-ии-помощник

  NFR-05:
    title: Round-trip проверяется на каждом коммите
    owner: interchange
    stages: ["1"]
    statement: |
      Lossless round-trip проверяется автоматически на каждом коммите.
      Регрессия round-trip блокирует сборку.
    anchors: [INV-IXC-005, UC-IXC-002]
    docs_ref: docs/backend.md#91-golden-file-тесты-round-trip--критический-контур

  NFR-06:
    title: Ключ Anthropic только на сервере
    owner: advisor
    stages: ["5"]
    statement: |
      Ключ Anthropic API хранится только на сервере и никогда не попадает
      в браузер.
    anchors: [INV-ADV-009]
    docs_ref: docs/backend.md#7-ии-помощник

  NFR-07:
    title: Атомарность изменений
    owner: modeling
    stages: ["2"]
    statement: |
      Все изменения модели атомарны: конкурентное сохранение без блокировки
      возвращает `409 Conflict`.
    anchors: [INV-MDL-003, INV-MDL-006, UC-MDL-004]
    docs_ref: docs/backend.md#8-обработка-ошибок

  NFR-08:
    title: Интерфейс на русском
    owner: ui
    stages: ["3"]
    statement: |
      Интерфейс на русском языке; строки вынесены в ресурсы для последующей
      локализации.
    anchors: [UI-021]
    docs_ref: docs/frontend.md#6-визуальный-язык
