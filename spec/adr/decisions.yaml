  - id: ADR-0016
    title: Фронтенд внутри archi-bootstrap, а не отдельным модулем реактора
    status: accepted
    date: 2026-09-29
    kind: architecture
    adr_file: 0016-frontend-location.md
    affects: [ui]
    requirements: []
    note: |
      Фронтенд не участвует в графе зависимостей Java: его результат —
      статика в target/classes/static, и ни один модуль от него не зависит.
      Восемнадцатый проект реактора не являлся бы ни слоем, ни контекстом
      и ломал бы правило ADR-0001, по которому здесь заводят модули.

