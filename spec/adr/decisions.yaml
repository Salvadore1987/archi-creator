# ───────────────────────────────────────────────────────────────────
# Индекс архитектурных решений (ADR) — единственный регистр решений.
#
# Правила:
#   - id последовательный и уникальный: ADR-0001, ADR-0002, ...
#   - status: proposed | accepted | rejected | deprecated | superseded
#   - kind:   architecture | format | product
#   - supersedes / superseded_by — явные ссылки на id других решений
#   - id не переиспользуется при удалении; удалённое = status: rejected
#
# Где лежит обоснование. У решения либо свой файл `NNNN-<slug>.md`
# в формате MADR (поле adr_file), либо раздел docs/ с уже написанным
# разбором (поле rationale_ref). Третьей копии текста не создаётся:
# двенадцать продуктовых решений были обоснованы в docs/ ещё до того,
# как появился этот индекс, и переписывать их в MADR значило бы
# поддерживать два текста об одном.
#
# Изменение от 2026-09-28: раньше этот файл ограничивался архитектурой
# реализации, а журнал продуктовых решений жил только в
# docs/archi-creator.md §13. После разворота источника правды на spec/
# регистр обязан быть один — иначе «где принято решение» отвечает docs,
# и разворот неполон. Поэтому §13 проиндексирован здесь целиком,
# а его текст остался на месте как обоснование.
# ───────────────────────────────────────────────────────────────────

decisions:

  - id: ADR-0001
    title: Разделение реализации на Maven-модули вместо пакетов одного модуля
    status: accepted
    date: 2026-09-22
    kind: architecture
    adr_file: 0001-maven-multi-module.md
    affects: [modeling, interchange, advisor]
    requirements: []
    implemented: 2026-09-29
    note: |
      Реализовано: 17 проектов в реакторе, граница домена подкреплена правилом
      maven-enforcer-plugin в шести модулях. Изоляция контекстов друг от друга
      закрыта 2026-09-29 правилами ArchUnit в archi-bootstrap
      (BoundedContextIsolationTest): сборка её не держит, потому что в bootstrap
      все двенадцать модулей встречаются на одном classpath. Ход работы —
      docs/plans/multi-module-pom.md.

  - id: ADR-0002
    title: Двойная идентификация — внутренний UUIDv7 и внешний archi_id
