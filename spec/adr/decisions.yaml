    kind: product
    rationale_ref: docs/backend.md#83-строгость-импорта
    requirements: [FR-49, FR-50]
    anchors: [INV-IXC-007]

  - id: ADR-0013
    title: Описание элемента — вкладка правой панели, а не отдельный режим
    status: accepted
    date: 2026-09-22
    kind: product
    rationale_ref: docs/frontend.md#67-вкладка-описание-правая-панель
    requirements: [FR-32, FR-33]
    anchors: [UI-014, UI-015]
