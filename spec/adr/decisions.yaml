    date: 2026-09-22
    kind: architecture
    adr_file: 0002-dual-identity.md
    affects: [modeling, interchange]
    requirements: [FR-01, FR-02]
    anchors: [INV-MDL-001, INV-IXC-001]
    implemented: 2026-10-08

  - id: ADR-0003
    title: Механизм публикации доменных событий
    status: proposed
    date: 2026-09-28
    kind: architecture
    adr_file: 0003-event-publishing.md
    affects: [modeling, interchange, advisor]
    requirements: [FR-37, FR-46]
    anchors: [INV-IXC-009]
    note: |
      Не принято. `direct` выбран как временное состояние; Git-выгрузка
      этапа 7a требует transactional_outbox — окно потери события там
      ломает правило очистки снимков версий.

  - id: ADR-0004
    title: Компоновка главного экрана — вариант A «Панели»
    status: accepted
    date: 2026-09-22
    kind: product
    rationale_ref: docs/frontend.md#65-компоновка-главного-экрана--решение-принято
    journal_ref: docs/archi-creator.md#13-открытые-вопросы
    requirements: [FR-30, FR-32, FR-33]
    anchors: [UI-012, UI-014, UI-015]
    rejected_alternatives:
      - B «Холст» — дерево модели не на виду, критично для 242 приложений
      - C «Два режима» — два интерфейса вместо одного; содержательная часть
        перенесена вкладкой «Описание» в вариант A

  - id: ADR-0005
    title: Git — журнал и ревью, источник правды остаётся в PostgreSQL
    status: accepted
    date: 2026-09-22
    kind: architecture
    rationale_ref: docs/backend.md#113-направление-обмена
    requirements: [FR-37, FR-38, FR-39]
    anchors: [INV-IXC-009, INV-IXC-010, INV-IXC-012]
    note: |
      Обратное направление — импорт состояния по ссылке; слияние — по сущностям
      через стабильные идентификаторы; текстовое слияние YAML запрещено.
      Этапы 7a/7b/7c.

  - id: ADR-0006
    title: Формат Git-выгрузки — разложенный YAML, файл на сущность
    status: accepted
    date: 2026-09-22
    kind: format
    rationale_ref: docs/backend.md#112-формат-разложенный-yaml
    requirements: [FR-37, FR-40]
    anchors: [INV-IXC-011]
    note: |
      Принадлежность папке — поле, а не каталог; разреженный position;
      детерминированный писатель. Изменения в модели данных, нужные уже
      на этапе 1, перечислены в docs/database.md §11.6.

  - id: ADR-0007
    title: Серверный экспорт в SVG и PNG, PDF не делаем
    status: accepted
    date: 2026-09-22
    kind: product
    rationale_ref: docs/backend.md#610-экспорт-представлений
    requirements: [FR-41, FR-42]
    anchors: [UI-019]
    consequences: |
      Фигуры узлов рисуются инлайн-SVG, а не CSS: CSS-силуэт серверный писатель
      воспроизвести не может. Геометрия выносится в общий shapes.json —
      spec/ui/shapes-contract.yaml. PDF остаётся печатью из браузера.

  - id: ADR-0008
    title: Open Exchange Format — только экспорт, best-effort
    status: accepted
    date: 2026-09-22
    kind: product
    rationale_ref: docs/backend.md#35-экспорт-в-open-exchange-format
    requirements: [FR-43, FR-44]
    anchors: [INV-IXC-006]
    note: |
      Импорта нет: единственный принимаемый формат остаётся `.archimate`.
      Обещание lossless относится только к нему. Этап 6a.

  - id: ADR-0009
    title: CSV-каталог — только экспорт
    status: accepted
    date: 2026-09-22
    kind: product
    rationale_ref: docs/backend.md#52-экспорт-каталога-в-csv
    requirements: [FR-45]
    anchors: [INV-IXC-008]
    note: |
      Импорта из CSV нет сознательно: таблица не источник правды, а приём
      правок из Excel вернул бы задачу слияния, которую решает Git (§11.4).

  - id: ADR-0010
    title: Ретеншен версий — записи бессрочно, снимки по правилу
    status: accepted
    date: 2026-09-22
    kind: architecture
    rationale_ref: docs/database.md#44-хранение-и-очистка-версий
    requirements: [FR-46, FR-47, FR-48]
    anchors: [INV-MDL-010]
    note: |
      Последние 30 дней, все помеченные версии, последняя версия месяца;
      остальное восстанавливается из Git. Очистка работает только там,
      где Git настроен и доступен.

  - id: ADR-0011
    title: Тёмной темы не будет
    status: accepted
    date: 2026-09-22
    kind: product
    rationale_ref: docs/frontend.md#62-токены
    requirements: [FR-19, FR-20]
    anchors: [UI-009, UI-010]
    note: |
      Корпус графитовый, холст светлый, переключателя тем нет. Цвета слоёв
      ArchiMate пастельные и рассчитаны на светлый фон; холст совпадает с тем,
      что уходит в экспорт и в документы.

  - id: ADR-0012
