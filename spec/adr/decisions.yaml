# ───────────────────────────────────────────────────────────────────
# Индекс архитектурных решений (ADR).
#
# Этот файл — машиночитаемый индекс; детали каждого решения в
# отдельном файле `NNNN-<slug>.md` в формате MADR.
#
# docs-generator агент может использовать этот индекс для генерации
# обзорной страницы "Принятые архитектурные решения" в wiki.
#
# Правила:
#   - id последовательный и уникальный: ADR-0001, ADR-0002, ...
#   - status: proposed | accepted | rejected | deprecated | superseded
#   - supersedes / superseded_by — явные ссылки на id других решений
#   - id не переиспользуется при удалении; удалённое = status: rejected
# ───────────────────────────────────────────────────────────────────

decisions: []

# Пусто намеренно: ADR заводятся отдельным осознанным шагом, а не
# плейсхолдером при раскатке scaffold'а.
#
# Решения, которые уже приняты и ждут оформления (см. README#незакрытые-решения):
#   1. Разделение реализации на Maven-модули вместо пакетов одного модуля.
#   2. Двойная идентификация: внутренний UUIDv7 + внешний archi_id.
#   3. Механизм публикации событий (direct сейчас, outbox с этапа 7a) — НЕ принято.
#
# Журнал уже закрытых продуктовых решений ведётся в
# docs/archi-creator.md §13 «Открытые вопросы». Переносить его сюда целиком
# не нужно: ADR — про архитектуру реализации, §13 — про продукт и формат.
