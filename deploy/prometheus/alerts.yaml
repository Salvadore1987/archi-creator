# ───────────────────────────────────────────────────────────────────
# Правила алертов Prometheus для контекстов modeling, interchange и advisor.
# Выражения согласованы с требованиями к наблюдаемости и правятся
# вслед за ними, а не отдельно.
#
# Метрики выставляет /actuator/prometheus на порту Actuator 9090 (роль ADMIN).
# ───────────────────────────────────────────────────────────────────
groups:
  - name: archi-creator-modeling
    rules:
      - alert: HighErrorRateSaveModel
        expr: |
          sum(rate(modeling_usecase_errors_total{usecase="SaveModel"}[5m]))
            / sum(rate(modeling_usecase_requests_total{usecase="SaveModel"}[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Ошибка сохранения — прямая угроза потери работы архитектора.

      - alert: SlowOpenModelP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(modeling_usecase_duration_seconds_bucket{usecase="OpenModel"}[5m]))
          ) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Нарушение NFR-01 — открытие модели дольше секунды в p95.

      - alert: ConcurrentSaveConflicts
        expr: |
          sum(rate(modeling_usecase_errors_total{error_code="INV-MDL-006"}[15m])) > 0.05
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: |
            Частые 409 означают, что блокировка не удерживается или UI её не
            показывает: пользователи наступают друг другу на правки.

  - name: archi-creator-interchange
    rules:
      - alert: RoundTripLossDetected
        expr: |
          sum(rate(interchange_export_loss_entries_total{format=~"ARCHIMATE|GIT_YAML"}[5m])) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: Потеря при выгрузке в формат без потерь — нарушение INV-IXC-005 в проде.

      - alert: SlowImportP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(interchange_usecase_duration_seconds_bucket{usecase="ImportArchimateFile"}[15m]))
          ) > 3
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: Нарушение NFR-02 — импорт дольше трёх секунд в p95.

      - alert: GitBindingUnreachable
        expr: |
          sum(rate(interchange_usecase_errors_total{usecase="PushModelToGit"}[15m])) > 0.05
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: Репозиторий привязки недоступен — проверить, что очистка снимков версий остановлена (FR-47).

  - name: archi-creator-advisor
    rules:
      - alert: SlowFirstTokenP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(advisor_first_token_seconds_bucket[10m]))
          ) > 3
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Нарушение NFR-04 — первые токены помощника дольше трёх секунд в p95.

      - alert: BudgetNearlyExhausted
        expr: advisor_budget_utilization_ratio > 0.8
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: Израсходовано больше 80 % месячного бюджета помощника — то же, что событие порога, в канале мониторинга.

      - alert: HighRejectionRate
        expr: |
          sum(rate(advisor_sessions_total{outcome="REJECTED"}[30m]))
            / sum(rate(advisor_sessions_total[30m])) > 0.2
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: Каждое пятое обращение к помощнику отклоняется — исчерпан бюджет или сработала частота.

      - alert: UpstreamCircuitOpen
        expr: resilience4j_circuitbreaker_state{name="anthropic_api",state="open"} == 1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: Предохранитель Anthropic API открыт дольше пяти минут — помощник отвечает «недоступен».
