# ───────────────────────────────────────────────────────────────────
# Конвейер сборки.
#
# Порядок: сборка → юнит → golden-file → интеграционные →
# фронтенд → Playwright → образ. Playwright идёт своей работой
# параллельно сборке: API в сценариях подменяется в браузере,
# и ни сервер, ни база им не нужны.
# ───────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:

  # Гейт целостности спеки и комментариев. Идёт отдельной работой и не ждёт
  # сборку: обрыв ссылки или требование без якоря видно за секунды, и узнавать
  # об этом после пятиминутной сборки незачем.
  spec:
    name: Целостность спеки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Каждый скрипт возвращает ненулевой код при первом нарушении.
      # Зависимостей у них нет — ставить нечего.
      - name: Ссылки между файлами
        run: tools/check-links.py

      - name: Требования ↔ якоря спеки
        run: tools/check-traceability.py

      # Таблица требований в обзоре — производная от реестра. Флаг --check
      # ловит правку руками: она была бы затёрта следующей генерацией.
      - name: §2 совпадает с реестром требований
        run: tools/render-requirements-index.py --check

      # Комментарий описывает поведение кода, а не отсылает к спеке:
      # номер раздела или якоря устаревает молча.
      - name: Комментарии без ссылок на спецификацию
        run: tools/check-comment-refs.py

      # Текст для человека — в i18n/messages*.properties по языку запроса,
      # в коде — ключ: русская строка или якорь в литерале не переводятся.
      - name: Строки кода без текста и якорей
        run: tools/check-string-literals.py

      # Тип называется простым именем через импорт: полное имя посреди кода
      # прячет зависимость файла от чужого пакета.
      - name: Импорты вместо полных имён
        run: tools/check-qualified-names.py

      # Числа требований записаны в application.yaml числом: правка одной
      # стороны без другой разводит спеку и конфигурацию молча.
      - name: Конфигурация совпадает с spec/nfr
        run: tools/check-nfr-config.py

  # Гейт сообщений коммитов. Хук .githooks/commit-msg живёт на машине
  # разработчика и обходится --no-verify; этот гейт не обходится.
  commits:
    name: Сообщения коммитов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: проверяется диапазон, а не один коммит.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Правило действует с коммита, которым введено, поэтому проверяется
      # диапазон новых коммитов, а не вся ветка: история до правила ему
      # не подчиняется и переписываться не будет.
      - name: Диапазон новых коммитов
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "value=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # Первый push ветки: сравнивать не с чем, берём последний коммит.
            echo "value=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.before }}..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверка сообщений
        run: tools/check-commit-message.py --range "${{ steps.range.outputs.value }}"

  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Node ставит frontend-maven-plugin сам (версия в pom.xml родителя),
      # поэтому setup-node здесь нет: две установки разошлись бы в версиях.
      - name: Кэш npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('archi-bootstrap/src/main/frontend/package-lock.json') }}
          restore-keys: npm-

      # Round-trip — отдельный шаг, а не строка в отчёте verify.
      # Регрессия видна по имени шага и останавливает конвейер до полной
      # сборки; в verify эти тесты пройдут ещё раз, это секунды.
      # Фронтенд не нужен: кодек его не касается.
      - name: Golden-file round-trip (NFR-05)
        run: >-
          ./mvnw -B --no-transfer-progress -P '!frontend'
          -pl archi-bootstrap -am test
          -Dtest='RoundTripGoldenFileTest,XmlEquivalenceTest'
          -Dsurefire.failIfNoSpecifiedTests=false

      # Классы *IT: контекст целиком на postgres:16 в Testcontainers.
      # Отдельным шагом, как golden-file: падение видно по имени шага.
      - name: Интеграционные (Testcontainers, postgres:16)
        run: >-
          ./mvnw -B --no-transfer-progress -P '!frontend'
          -pl archi-bootstrap -am verify -DskipUnitTests

      # Профиль frontend включён по умолчанию: jar обязан уехать
      # со статикой внутри, и выключать его в CI нельзя.
      # Интеграционные уже прошли шагом выше — здесь не повторяются.
      # Без clean: данные покрытия интеграционных тестов (jacoco-it.exec)
      # остаются в target/ и входят в общий отчёт JaCoCo.
      - name: mvn verify
        run: ./mvnw -B --no-transfer-progress verify -DskipITs

      - name: Покрытие тестами
        run: tools/check-coverage.py

      - name: Собранный jar
        uses: actions/upload-artifact@v4
        with:
          name: archi-creator-jar
          path: archi-bootstrap/target/archi-creator-*.jar
          if-no-files-found: error
          retention-days: 7

  # Сценарии E2E, визуальные снимки и замер канвы. Сервер не поднимается:
  # API подменяет in-memory сервер на снимке эталонной модели.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Браузер, шрифты и сглаживание — из образа Playwright, в котором снят визуальный
    # эталон (…-chromium-linux.png): на голом ubuntu-latest шрифты другие, и снимок
    # расходился на 2 %. Тег образа — версия @playwright/test из package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: archi-bootstrap/src/main/frontend
    steps:
      - uses: actions/checkout@v4

      # Версия Node — та, что ставит сборка: читается из pom.xml родителя,
      # а не дублируется здесь, иначе две версии разошлись бы.
      - name: Версия Node из pom.xml
        id: node
        working-directory: .
        run: echo "version=$(sed -n 's:.*<node.version>v\(.*\)</node.version>.*:\1:p' pom.xml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: archi-bootstrap/src/main/frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # Браузер уже в образе — ставить нечего.
      - name: Сценарии Playwright
        run: npx playwright test

      - name: Отчёт при отказе
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: archi-bootstrap/src/main/frontend/test-results
          retention-days: 7

  image:
    name: Образ приложения
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: archi
          POSTGRES_USER: archi
          POSTGRES_PASSWORD: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archi -d archi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Собранный jar
        uses: actions/download-artifact@v4
        with:
          name: archi-creator-jar
          path: archi-bootstrap/target

      # Dockerfile упаковывает готовый jar и сам ничего не собирает,
      # поэтому образ строится из артефакта предыдущей работы, а не заново.
      - name: docker build
        run: docker build -t archi-creator:${{ github.sha }} .

      # Проверяется не «собрался», а «поднимается»: образ с базой должен
      # дойти до UP. Это тот же критерий, что у ручного запуска состава, только без
      # Keycloak: вход сервера проверяют KeycloakIT и SessionIT, а сценарии
      # Playwright идут на подменённом API и Keycloak не касаются.
      - name: Образ поднимается и отвечает UP
        run: |
          docker run -d --name archi-smoke --network host \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e ARCHI_DB_URL=jdbc:postgresql://localhost:5432/archi \
            -e ARCHI_DB_USER=archi \
            -e ARCHI_DB_PASSWORD=smoke \
            archi-creator:${{ github.sha }}
          for i in $(seq 1 45); do
            if curl -fs http://localhost:9090/actuator/health | grep -q '"status":"UP"'; then
              echo "health UP"
              exit 0
            fi
            sleep 2
          done
          docker logs archi-smoke
          exit 1

      - name: Логи при отказе
        if: failure()
        run: docker logs archi-smoke || true
